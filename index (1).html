<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ceraa — Control Plane & Telemetry</title>
  <meta name="description" content="Ceraa control plane: provider profiles, reasoning effort, memory half-life, encrypted secret store, session ledger, and token cache telemetry." />
  <meta property="og:title" content="Ceraa — Control Plane & Telemetry" />
  <meta property="og:description" content="Ceraa control plane: provider profiles, reasoning effort, memory half-life, encrypted secret store, session ledger, and token cache telemetry." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
     * CERAA FOLIO DESIGN SYSTEM (Daylight Architectural / Swiss Broadsheet)
     * Exact warm paper & burnt sienna palette (#B83A08)
     * Fluid responsive 6-step typographic hierarchy + zero horizontal overflow
     * ========================================================================= */
    :root {
      --sf: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --serif: "Newsreader", Georgia, serif;

      --ground: #F6F4EF;       /* Warm museum paper */
      --well: #ECE8DF;         /* Recessed control well */
      --well-hover: #E3DEC3;
      --ink: #121110;          /* Deep carbon ink */
      --ink-2: #524E46;        /* Secondary warm umber */
      --ink-3: #6B665E;        /* Muted taupe index */
      --rule: #D8D3C8;         /* 1px architectural hairline */
      --rule-strong: #121110;  /* Primary structural rule */
      --accent: #B83A08;       /* Burnt sienna / vermilion (#B83A08) */
      --fault: #A81E14;        /* Semantic fault crimson */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--sf);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
    }

    button, input, select {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
    }

    .tnum { font-variant-numeric: tabular-nums; }

    /* =========================================================================
     * 6-STEP TYPOGRAPHY SCALE (56/44, 24/21, 18, 15, 13, 12)
     * ========================================================================= */
    .t-hero {
      font-family: var(--sf);
      font-size: clamp(42px, 5vw, 56px);
      font-weight: 800;
      line-height: 0.94;
      letter-spacing: -0.04em;
      color: var(--ink);
    }
    .t-display {
      font-family: var(--serif);
      font-size: clamp(20px, 2.2vw, 24px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .t-sec {
      font-family: var(--sf);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.015em;
      color: var(--ink);
    }
    .t-row {
      font-family: var(--sf);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.01em;
      color: var(--ink);
      word-break: break-word;
    }
    .t-body {
      font-family: var(--sf);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-2);
      word-break: break-word;
    }
    .t-mono {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.02em;
      color: var(--ink-2);
      word-break: break-word;
    }

    /* =========================================================================
     * SHELL & ARCHITECTURAL MASTHEAD
     * ========================================================================= */
    .shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: 36px 44px 64px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    @media (max-width: 1024px) {
      .shell {
        padding: 28px 28px 56px;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 20px 18px 116px; /* Bottom clearance for floating capsule dock */
      }
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--rule-strong);
      flex-wrap: wrap;
    }

    .masthead-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1;
    }
    .brand-title em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: var(--well);
      border-radius: 999px;
      border: 1px solid var(--rule);
    }

    .masthead-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .masthead {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        padding-bottom: 18px;
      }
      .masthead-controls {
        width: 100%;
        justify-content: space-between;
        gap: 10px;
      }
      .desktop-tabs {
        display: none !important;
      }
      .provider-field {
        flex: 1;
        min-width: 0;
      }
      .provider-field select {
        width: 100%;
        text-overflow: ellipsis;
      }
    }

    .field-inline {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-clean {
      background: var(--well);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      border: 1px solid var(--rule);
      max-width: 100%;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .input-clean:focus {
      border-color: var(--accent);
      background: var(--ground);
    }

    /* Floating Capsule Icon Navbar (matches uploaded reference image) */
    .capsule-dock {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #FDFBF7;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(216, 211, 200, 0.75);
      box-shadow: 0 12px 32px rgba(18, 17, 16, 0.08), 0 2px 6px rgba(18, 17, 16, 0.04);
    }
    .capsule-nav-item {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #8C867B;
      cursor: pointer;
      position: relative;
      transition: background 0.22s cubic-bezier(0.2, 0.9, 0.3, 1), color 0.2s ease, transform 0.18s ease;
    }
    .capsule-nav-item:hover {
      color: var(--ink);
    }
    .capsule-nav-item.active {
      background: rgba(184, 58, 8, 0.12);
      color: var(--accent);
    }
    .capsule-nav-item:active {
      transform: scale(0.94);
    }

    /* Fixed Bottom Floating Capsule Dock for Mobile & Tablet (<768px) */
    .mobile-capsule-wrapper {
      display: none;
    }
    @media (max-width: 768px) {
      .mobile-capsule-wrapper {
        display: flex;
        justify-content: center;
        position: fixed;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        left: 0;
        right: 0;
        pointer-events: none;
        z-index: 260;
      }
      .mobile-capsule-wrapper .capsule-dock {
        pointer-events: auto;
        width: min(316px, calc(100vw - 40px));
        padding: 8px 12px;
        background: rgba(253, 251, 247, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 16px 40px rgba(18, 17, 16, 0.14), 0 3px 10px rgba(18, 17, 16, 0.06);
      }
      .mobile-capsule-wrapper .capsule-nav-item {
        width: 52px;
        height: 52px;
      }
    }

    /* Four-Boxes Grid Menu Button & Popover */
    .grid-menu-wrap {
      position: relative;
      flex: none;
    }
    .grid-menu-btn {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: var(--well);
      border: 1px solid var(--rule);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }
    .grid-menu-btn:hover,
    .grid-menu-btn.open {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--ground);
    }
    .grid-menu-popover {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(310px, calc(100vw - 36px));
      background: var(--ground);
      border: 1.5px solid var(--rule-strong);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 44px rgba(18, 17, 16, 0.14);
      z-index: 300;
    }
    .grid-menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .grid-menu-tile {
      padding: 12px;
      border-radius: 8px;
      background: var(--well);
      border: 1px solid transparent;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .grid-menu-tile:hover,
    .grid-menu-tile.active {
      border-color: var(--accent);
      background: var(--ground);
    }

    /* =========================================================================
     * 3-COLUMN ARCHITECTURAL BOARD (Generous Breathing Room & Mobile Stack)
     * ========================================================================= */
    .board {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr) 390px;
      flex: 1;
      border-bottom: 1px solid var(--rule);
    }

    @media (max-width: 1220px) {
      .board {
        grid-template-columns: 1fr 1fr;
      }
      .col-left {
        padding-right: 28px !important;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .col-center {
        padding-left: 28px !important;
        padding-right: 0 !important;
        border-right: none !important;
        border-bottom: 1px solid var(--rule);
      }
      .col-right {
        grid-column: 1 / -1;
        padding-left: 0 !important;
      }
    }

    @media (max-width: 820px) {
      .board {
        grid-template-columns: 1fr;
      }
      .col, .col-left, .col-center, .col-right {
        padding: 28px 0 !important;
        border-right: none !important;
        border-bottom: 1px solid var(--rule);
      }
      .col:last-child {
        border-bottom: none;
      }
    }

    .col {
      display: flex;
      flex-direction: column;
      padding: 36px 0;
      min-width: 0;
    }
    .col-left {
      padding-right: 38px;
      border-right: 1px solid var(--rule);
    }
    .col-center {
      padding-left: 42px;
      padding-right: 42px;
      border-right: 1px solid var(--rule);
    }
    .col-right {
      padding-left: 38px;
    }

    /* Hero Band inside each Column */
    .hero-band {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-bottom: 26px;
      border-bottom: 1px solid var(--rule);
      min-height: 112px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero-unit {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--accent);
      margin-left: 10px;
    }

    /* Section Header */
    .sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 32px;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sec-head:first-of-type {
      margin-top: 26px;
    }

    .action-link {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      padding: 4px 0;
    }
    .action-link:hover {
      text-decoration: underline;
    }

    /* Clean Hairline Rows */
    .hairline-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--rule);
    }

    .h-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 13px 8px;
      border-bottom: 1px solid var(--rule);
      gap: 14px;
      transition: background 0.14s ease;
    }
    .h-row.clickable {
      cursor: pointer;
    }
    .h-row.clickable:hover,
    .h-row:hover {
      background: rgba(18, 17, 16, 0.024);
    }
    .h-row.active-row {
      background: rgba(184, 58, 8, 0.055);
    }

    @media (max-width: 560px) {
      .h-row.stack-mobile {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 4px;
      }
      .h-row.stack-mobile .h-right {
        margin-left: 20px;
        width: calc(100% - 20px);
        justify-content: space-between;
      }
    }

    .h-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .h-left .dot {
      margin-top: 6px;
    }

    .h-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
    }

    /* Precision LEDs */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex: none;
    }
    .dot.idle {
      background: transparent;
      border: 1.75px solid var(--ink-3);
    }
    .dot.done {
      background: var(--ink-2);
    }
    .dot.fault {
      background: var(--fault);
    }

    /* Tactile Mechanical Switch */
    .switch {
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: var(--well);
      border: 1px solid var(--rule);
      position: relative;
      cursor: pointer;
      flex: none;
      transition: background 0.18s ease, border-color 0.18s ease;
    }
    .switch.on {
      background: var(--accent);
      border-color: var(--accent);
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ink);
      transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1), background 0.18s ease;
    }
    .switch.on::after {
      transform: translateX(18px);
      background: var(--ground);
    }

    /* Filter Bar / Sub-navigation */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .filter-item {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      cursor: pointer;
      padding-bottom: 5px;
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .filter-item:hover {
      color: var(--ink);
    }
    .filter-item.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    /* Subtle Action Buttons */
    .row-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .mini-btn {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--well);
      border: 1px solid var(--rule);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    .mini-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--ground);
    }
    .mini-btn.danger {
      color: var(--fault);
    }
    .mini-btn.danger:hover {
      background: var(--fault);
      border-color: var(--fault);
      color: var(--ground);
    }
    .mini-btn.stop-btn {
      background: var(--fault);
      border-color: var(--fault);
      color: var(--ground);
      padding: 7px 14px;
    }
    .mini-btn.stop-btn:hover {
      opacity: 0.9;
    }

    /* Inline Form Drawer */
    .drawer-form {
      display: flex;
      gap: 8px;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-solid {
      background: var(--ink);
      color: var(--ground);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-solid:hover {
      background: var(--accent);
    }

    /* 2x2 Architectural Readout Grid */
    .telem-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-top: 18px;
    }
    .telem-cell {
      padding: 16px 0;
      min-width: 0;
    }
    .telem-cell:nth-child(odd) {
      padding-right: 16px;
      border-right: 1px solid var(--rule);
    }
    .telem-cell:nth-child(even) {
      padding-left: 16px;
    }
    .telem-cell:nth-child(1),
    .telem-cell:nth-child(2) {
      border-bottom: 1px solid var(--rule);
    }

    /* Segmented Pill Selector for 3-way choices */
    .seg-group {
      display: inline-flex;
      background: var(--well);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--rule);
      gap: 2px;
      flex-wrap: wrap;
    }
    .seg-item {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      color: var(--ink-2);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .seg-item.active {
      background: var(--ground);
      color: var(--accent);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    /* Monospace Path Box (Wrap cleanly on mobile) */
    .path-well {
      padding: 12px 14px;
      background: var(--well);
      border: 1px solid var(--rule);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      word-break: break-all;
    }

    /* Error / Notice Callout */
    .notice-bar {
      padding: 12px 14px;
      border-left: 3px solid var(--fault);
      background: rgba(168, 30, 20, 0.06);
      border-radius: 0 6px 6px 0;
      margin: 10px 0;
      animation: fadeSlideUp 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* =========================================================================
     * INTERACTIVE ANIMATIONS, KEYFRAMES & TOKEN CONSUMPTION CHART
     * ========================================================================= */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseHalo {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(184, 58, 8, 0.45);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(184, 58, 8, 0);
      }
    }

    .board {
      animation: fadeSlideUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .dot:not(.idle):not(.done):not(.fault) {
      animation: pulseHalo 2.4s infinite ease-in-out;
    }

    .rotary-needle {
      transition: transform 0.48s cubic-bezier(0.22, 1.25, 0.36, 1);
      transform-origin: 40px 34px;
    }

    .gauge-ring {
      transition: stroke-dashoffset 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .h-row {
      transition: background 0.16s ease, transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .h-row.clickable:active {
      transform: scale(0.992);
    }

    /* Interactive Token Consumption Chart */
    .token-chart-card {
      padding: 16px 0 18px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-top: 14px;
    }
    .token-chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .token-chart-legend {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
    }
    .legend-swatch {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      display: inline-block;
    }
    .chart-svg-wrap {
      position: relative;
      width: 100%;
      user-select: none;
    }
    .chart-path-anim {

    // =========================================================================
    // SMOOTH ANIMATED NUMBER COUNTER HOOK & COMPONENT
    // =========================================================================
    function useAnimatedNumber(target, duration = 620) {
      const [val, setVal] = useState(target);
      const prevRef = useRef(target);

      useEffect(() => {
        const startVal = Number(prevRef.current) || 0;
        const endVal = Number(target) || 0;
        if (startVal === endVal) {
          setVal(endVal);
          return;
        }
        let rafId;
        const startTime = performance.now();

        const tick = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          // Ease out quart
          const eased = 1 - Math.pow(1 - progress, 4);
          const current = startVal + (endVal - startVal) * eased;
          setVal(current);
          if (progress < 1) {
            rafId = requestAnimationFrame(tick);
          } else {
            prevRef.current = endVal;
          }
        };

        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [target, duration]);

      return val;
    }

    function AnimatedNumber({ value, decimals = 0, prefix = "", suffix = "", padStart = 0, locale = false }) {
      const animated = useAnimatedNumber(value);
      let formatted;
      if (decimals > 0) {
        formatted = animated.toFixed(decimals);
      } else {
        const rounded = Math.round(animated);
        formatted = locale ? rounded.toLocaleString() : String(rounded);
        if (padStart > 0) {
          formatted = String(rounded).padStart(padStart, "0");
        }
      }
      return (
        <span>
          {prefix}
          {formatted}
          {suffix}
        </span>
      );

                  <div>
                    <div className="t-display">
                      Max <em style={{ fontStyle: "italic", color: "var(--accent)" }}>{runParams.maxConcurrentTools} parallel</em> calls
                    </div>
                    <div className="t-body tnum">
                      Truncated at {runParams.maxToolResultChars.toLocaleString()} chars per tool output
                    </div>
                  </div>
                </div>

                <div className="sec-head">
                  <h2 className="t-sec">Read-Only Tool Inventory</h2>
                  <span className="t-mono">INSPECT BEFORE ALLOWING</span>
                </div>

                <div className="hairline-list">
                  {TOOL_INVENTORY.map((tool) => {
                    const isAllowed = alwaysAllow.includes(tool.id);
                    return (
                      <div key={tool.id} className="h-row">
                        <div className="h-left">
                          <span className={`dot ${isAllowed ? "" : "done"}`} />
                          <div>
                            <div className="t-row">
                              {tool.id}{" "}
                              <span className="t-mono" style={{ marginLeft: 8 }}>{tool.category.toUpperCase()}</span>
                            </div>
                            <div className="t-body">{tool.desc}</div>
                          </div>
                        </div>
                        <div className="h-right">
                          <span className="t-mono" style={{ color: isAllowed ? "var(--accent)" : "var(--ink-3)" }}>
                            {isAllowed ? "ALWAYS ALLOW" : "ASK FIRST"}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>

              {/* COLUMN 3: 7. SCHEDULED JOBS LIST & DELETE */}
              <section className="col col-right">
                <div className="hero-band">
                  <div>
                    <div className="t-mono" style={{ marginBottom: 8 }}>SCHEDULED CRON JOBS</div>
                    <div className="t-hero tnum">
                      <AnimatedNumber value={scheduledJobs.length} padStart={2} />
                      <span className="hero-unit">ACTIVE</span>
                    </div>
                  </div>
                  <div>
                    <button className="action-link" onClick={() => setAddingJob(!addingJob)}>
                      {addingJob ? "Cancel" : "+ New schedule"}
                    </button>
                  </div>
                </div>

                {addingJob && (
                  <form className="drawer-form" onSubmit={handleAddJob}>
                    <input
                      type="text"
                      className="input-clean"
                      style={{ width: 110 }}
                      value={newJobCron}
                      onChange={(e) => setNewJobCron(e.target.value)}
                      placeholder="0 9 * * *"
                    />
                    <input
                      type="text"
                      className="input-clean"
                      style={{ flex: 1, minWidth: 160 }}
                      value={newJobTask}
                      onChange={(e) => setNewJobTask(e.target.value)}
                      placeholder="Prompt or maintenance job..."
                      autoFocus
                    />
                    <button type="submit" className="btn-solid">Add</button>
                  </form>
                )}

                <div className="sec-head">
                  <h2 className="t-sec">Scheduled Jobs</h2>
                  <span className="t-mono">CRON DISPATCHER</span>
                </div>

                <div className="hairline-list">
                  {scheduledJobs.map((job) => (
                    <div key={job.id} className="h-row stack-mobile">
                      <div className="h-left">
                        <span className="dot" />
                        <div>
                          <div className="t-row">{job.task}</div>
                          <div className="t-body" style={{ marginTop: 2 }}>
                            <span className="t-mono" style={{ color: "var(--accent)" }}>{job.cron}</span>
                            {" · "}Target: {job.session}
                          </div>
                        </div>
                      </div>
                      <div className="h-right">
                        <button
                          type="button"
                          className="mini-btn danger"
                          onClick={() => setScheduledJobs(scheduledJobs.filter((j) => j.id !== job.id))}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            </main>
          )}

          {/* =================================================================
              TAB 4: "Agents" — 1. PROVIDER PROFILES, SUBSCRIPTIONS & CATALOG,
                                2. RUN PARAMETERS, 4. ENCRYPTED SECRETS STORE
              ================================================================= */}
          {activeTab === "Agents" && (
            <main className="board" key="board-agents">
              {/* COLUMN 1: 1. PROVIDER PROFILES, SUBSCRIPTION AUTH & MODEL CATALOG */}
              <section className="col col-left">
                <div className="hero-band">
                  <div>
                    <div className="t-mono" style={{ marginBottom: 8 }}>PROVIDER PROFILES</div>
                    <div className="t-hero tnum">
                      <AnimatedNumber value={providerProfiles.length} padStart={2} />
                      <span className="hero-unit">PROFILES</span>
                    </div>
                  </div>
                  <div>
                    <button className="action-link" onClick={() => setAddingProfile(!addingProfile)}>
                      {addingProfile ? "Cancel" : "+ Add profile"}
                    </button>
                    <div className="t-body">Active: {activeProfile.name}</div>
                  </div>
                </div>

                {addingProfile && (
                  <form
                    className="drawer-form"
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (!profileDraft.name.trim()) return;
                      const id = profileDraft.name.trim().toLowerCase().replace(/[^a-z0-9-_]/g, "-");
                      setProviderProfiles([
                        ...providerProfiles,
                        { ...profileDraft, id, name: id, pricingUsable: true }
                      ]);
                      setAddingProfile(false);
                    }}
                  >
                    <input
                      className="input-clean"
                      placeholder="Profile ID (e.g. groq-fast)"
                      value={profileDraft.name}
                      onChange={(e) => setProfileDraft({ ...profileDraft, name: e.target.value })}
                      style={{ flex: "1 1 140px" }}
                      autoFocus
                    />
                    <input
                      className="input-clean"
                      placeholder="Model name"
                      value={profileDraft.model}
                      onChange={(e) => setProfileDraft({ ...profileDraft, model: e.target.value })}
                      style={{ flex: "1 1 140px" }}
                    />
                    <input
                      className="input-clean"
                      placeholder="Endpoint URL"
                      value={profileDraft.endpoint}
                      onChange={(e) => setProfileDraft({ ...profileDraft, endpoint: e.target.value })}
                      style={{ flex: "1 1 100%" }}
                    />
                    <button type="submit" className="btn-solid">Save Profile</button>
                  </form>
                )}

                <div className="sec-head">
                  <h2 className="t-sec">Configured Profiles</h2>
                  <span className="t-mono">WITH CONFIRM DELETE</span>
                </div>

                <div className="hairline-list">
                  {providerProfiles.map((prof) => {
                    const isAct = prof.id === activeProviderId;
                    return (
                      <div key={prof.id} className={`h-row stack-mobile ${isAct ? "active-row" : ""}`}>
                        <div className="h-left" onClick={() => setActiveProviderId(prof.id)} style={{ cursor: "pointer" }}>
                          <span className={`dot ${isAct ? "" : "done"}`} />
                          <div>
                            <div className="t-row">
                              {prof.name}{" "}
                              {isAct && <span className="t-mono" style={{ color: "var(--accent)" }}>● ACTIVE</span>}
                            </div>
                            <div className="t-body tnum">
                              {prof.model} · {prof.endpoint}
                            </div>
                            <div className="t-mono tnum" style={{ marginTop: 4 }}>
                              Key: {prof.apiKeyRef} · Effort: {prof.reasoning} · Ctx: {(prof.contextLimit / 1000).toFixed(0)}k · Out: {prof.outputCap} · Cache: {prof.cacheMode}
                            </div>
                          </div>
                        </div>
                        <div className="h-right">
                          {confirmDeleteProfileId === prof.id ? (
                            <div className="row-actions">
                              <button
                                type="button"
                                className="mini-btn danger"
                                onClick={() => {
                                  if (providerProfiles.length <= 1) return;
                                  const next = providerProfiles.filter((p) => p.id !== prof.id);
                                  setProviderProfiles(next);
                                  if (activeProviderId === prof.id) setActiveProviderId(next[0].id);
                                  setConfirmDeleteProfileId(null);
                                }}
                              >
                                Confirm
                              </button>
                              <button
                                type="button"
                                className="mini-btn"
                                onClick={() => setConfirmDeleteProfileId(null)}
                              >
                                Cancel
                              </button>
                            </div>
                          ) : (
                            <button
                              type="button"
                              className="mini-btn danger"
                              onClick={() => setConfirmDeleteProfileId(prof.id)}
                            >
                              Remove
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Subscription Auth States */}
                <div className="sec-head">
                  <h2 className="t-sec">Subscription Auth States</h2>
                  <span className="t-mono">OAUTH / KEY</span>
                </div>

                <div className="hairline-list">
                  {subscriptions.map((sub) => (
                    <div key={sub.id} className="h-row">
                      <div className="h-left">
                        <span className={`dot ${sub.signedIn ? "" : "idle"}`} />
                        <div>
                          <div className="t-row">{sub.provider}</div>
                          <div className="t-body">
                            {sub.authType} · {sub.signedIn ? sub.entry : "Not signed in"}
                          </div>
                        </div>
                      </div>
                      <div className="h-right">
                        <button
                          type="button"
                          className="mini-btn"
                          onClick={() =>
                            setSubscriptions((prev) =>
                              prev.map((s) =>
                                s.id === sub.id
                                  ? { ...s, signedIn: !s.signedIn, entry: !s.signedIn ? "operator@ceraa.dev" : "—" }
                                  : s
                              )
                            )
                          }
                        >
                          {sub.signedIn ? "Disconnect" : "Connect"}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Model Catalog */}
                <div className="sec-head">
                  <h2 className="t-sec">Model Catalog</h2>
                  <button
                    type="button"
                    className="action-link"
                    onClick={() =>
                      setModelCatalog((prev) => ({
                        ...prev,
                        lastRefresh: "Just now (414 models indexed)"
                      }))
                    }
                  >
                    ↻ Refresh now
                  </button>
                </div>
                <div className="hairline-list">
                  <div className="h-row stack-mobile">
                    <div className="h-left">
                      <div>
                        <div className="t-row">Catalog Source & Refresh Interval</div>
                        <div className="t-body" style={{ wordBreak: "break-all" }}>{modelCatalog.sourceUrl}</div>
                        <div className="t-mono" style={{ marginTop: 4 }}>{modelCatalog.lastRefresh}</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <span className="t-mono tnum">Every {modelCatalog.refreshHours}h</span>
                    </div>
                  </div>
                </div>
              </section>

              {/* COLUMN 2: 2. GROUNDED RUN PARAMETERS */}
              <section className="col col-center">
                <div className="hero-band">
                  <div>
                    <div className="t-mono" style={{ marginBottom: 8 }}>REASONING EFFORT LEVER</div>
                    <div className="t-hero" style={{ textTransform: "uppercase" }}>
                      {runParams.reasoningEffort}
                    </div>
                  </div>
                  <div>
                    <div className="t-body">Primary creativity & token budget lever across Ceraa providers</div>
                  </div>
                </div>

                <div className="sec-head">
                  <h2 className="t-sec">Run Parameters</h2>
                  <span className="t-mono">RUNTIME CONFIG</span>
                </div>

                <div className="hairline-list">
                  {/* Reasoning Effort Selector */}
                  <div className="h-row">
                    <div className="h-left">
                      <div>
                        <div className="t-row">Reasoning Effort</div>
                        <div className="t-body">off · minimal · low · medium · high · xhigh · max</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <select
                        className="input-clean"
                        value={runParams.reasoningEffort}
                        onChange={(e) => setRunParams({ ...runParams, reasoningEffort: e.target.value })}
                      >
                        {REASONING_LEVELS.map((lvl) => (
                          <option key={lvl} value={lvl}>{lvl.toUpperCase()}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* 🧮 Context Limit */}
                  <div className="h-row">
                    <div className="h-left">
                      <div>
                        <div className="t-row">🧮 Context Limit (Tokens)</div>
                        <div className="t-body">Integer context window ceiling before compaction</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <input
                        type="number"
                        step="8000"
                        className="input-clean tnum"
                        style={{ width: 110, textAlign: "right" }}
                        value={runParams.contextLimit}
                        onChange={(e) => setRunParams({ ...runParams, contextLimit: Number(e.target.value) || 0 })}
                      />
                    </div>
                  </div>

                  {/* Max Output Tokens */}
                  <div className="h-row">
                    <div className="h-left">
                      <div>
                        <div className="t-row">Max Output Tokens</div>
                        <div className="t-body">Per-turn completion + thinking token cap</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <input
                        type="number"
                        step="1024"
                        className="input-clean tnum"
                        style={{ width: 110, textAlign: "right" }}
                        value={runParams.maxOutputTokens}
                        onChange={(e) => setRunParams({ ...runParams, maxOutputTokens: Number(e.target.value) || 0 })}
                      />
                    </div>
                  </div>

                  {/* Max Tool Result Chars */}
                  <div className="h-row">
                    <div className="h-left">
                      <div>
                        <div className="t-row">Max Tool Result Chars</div>
                        <div className="t-body">Decides how much tool stdout/file output the model sees per call</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <input
                        type="number"
                        step="2000"
                        className="input-clean tnum"
                        style={{ width: 110, textAlign: "right" }}
                        value={runParams.maxToolResultChars}
                        onChange={(e) => setRunParams({ ...runParams, maxToolResultChars: Number(e.target.value) || 0 })}
                      />
                    </div>
                  </div>

                  {/* Max Concurrent Tools */}
                  <div className="h-row">
                    <div className="h-left">
                      <div>
                        <div className="t-row">Max Concurrent Tools</div>
                        <div className="t-body">Parallel tool execution fan-out limit per turn</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <input
                        type="number"
                        min="1"
                        max="16"
                        className="input-clean tnum"
                        style={{ width: 80, textAlign: "right" }}
                        value={runParams.maxConcurrentTools}
                        onChange={(e) => setRunParams({ ...runParams, maxConcurrentTools: Number(e.target.value) || 1 })}
                      />
                    </div>
                  </div>

                  {/* Prompt Cache Mode & TTL */}
                  <div className="h-row stack-mobile">
                    <div className="h-left">
                      <div>
                        <div className="t-row">Prompt Cache Mode & TTL</div>
                        <div className="t-body">Controls provider prefix caching & breakpoint lifetime</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <select
                        className="input-clean"
                        value={runParams.promptCacheMode}
                        onChange={(e) => setRunParams({ ...runParams, promptCacheMode: e.target.value })}
                      >
                        <option value="ephemeral">ephemeral</option>
                        <option value="auto-prefix">auto-prefix</option>
                        <option value="off">off</option>
                      </select>
                      <select
                        className="input-clean"
                        value={runParams.promptCacheTTL}
                        onChange={(e) => setRunParams({ ...runParams, promptCacheTTL: e.target.value })}
                      >
                        <option value="5m">5m</option>
                        <option value="1h">1h</option>
                      </select>
                    </div>
                  </div>

                  {/* Memory Delivery: cached | prompt | sidekick */}
                  <div className="h-row stack-mobile">
                    <div className="h-left">
                      <div>
                        <div className="t-row">Memory Delivery</div>
                        <div className="t-body">Tradeoff: cache-hit cost (cached) vs dynamic injection (prompt / sidekick)</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <div className="seg-group">
                        {["cached", "prompt", "sidekick"].map((mode) => (
                          <button
                            key={mode}
                            type="button"
                            className={`seg-item ${runParams.memoryDelivery === mode ? "active" : ""}`}
                            onClick={() => setRunParams({ ...runParams, memoryDelivery: mode })}
                          >
                            {mode}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Agent Selector */}
                  <div className="h-row">
                    <div className="h-left">
                      <div>
                        <div className="t-row">Agent Selector</div>
                        <div className="t-body">Active system prompt persona & harness policy</div>
                      </div>
                    </div>
                    <div className="h-right">
                      <select
                        className="input-clean"
                        value={runParams.agentRole}
                        onChange={(e) => setRunParams({ ...runParams, agentRole: e.target.value })}
                      >
                        <option value="architect-default">architect-default</option>
                        <option value="code-surgical">code-surgical</option>
                        <option value="research-sidekick">research-sidekick</option>
                      </select>
                    </div>
                  </div>
                </div>
              </section>

              {/* COLUMN 3: 4. ENCRYPTED SECRETS STORE */}
              <section className="col col-right">
                <div className="hero-band">
                  <div>
                    <div className="t-mono" style={{ marginBottom: 8 }}>AES-256 SECRET STORE</div>
                    <div className="t-hero tnum">
                      <AnimatedNumber value={secrets.length} padStart={2} />
                      <span className="hero-unit">KEYS</span>
                    </div>
                  </div>
                  <div>
                    <button
                      className="action-link"
                      onClick={() => {
                        setAddingSecret(!addingSecret);
                        setSecretError(null);
                      }}
                    >
                      {addingSecret ? "Cancel" : "+ Add secret"}
                    </button>
                    <div className="t-body">Names & byte lengths only</div>
                  </div>
                </div>

                {addingSecret && (
                  <form className="drawer-form" onSubmit={handleSaveSecret} autoComplete="off">
                    <input
                      type="text"
                      className="input-clean"
                      placeholder="NAME (e.g. STRIPE_KEY)"
                      value={secretNameInput}
                      onChange={(e) => setSecretNameInput(e.target.value)}
                      autoComplete="off"
                      spellCheck="false"
                      style={{ flex: "1 1 130px" }}
                      autoFocus
                    />
                    <input
                      type="password"
                      ref={secretValueRef}
                      className="input-clean"
                      placeholder="Secret value (never echoed)"
                      autoComplete="new-password"
                      data-lpignore="true"
                      style={{ flex: "1 1 160px" }}
                    />
                    <button type="submit" className="btn-solid">Seal</button>
                  </form>
                )}

                {secretError && (
                  <div className="notice-bar">
                    <div className="t-body" style={{ color: "var(--fault)", fontWeight: 600 }}>
                      {secretError}
                    </div>
                  </div>
                )}

                <div className="sec-head">
                  <h2 className="t-sec">Stored Secrets (SecretsMenu)</h2>
                  <span className="t-mono">NO VALUE IN DOM</span>
                </div>
                <div className="t-body" style={{ marginBottom: 12 }}>
                  Values are encrypted at rest and wiped from the input buffer on save. Reserved prefixes (<code>CERAA_</code>, <code>TELEGRAM_</code>, <code>SYSTEM_</code>, <code>INTERNAL_</code>) are blocked by <code>IsInternal</code>.
                </div>

                <div className="hairline-list">
                  {secrets.map((sec) => (
                    <div key={sec.name} className="h-row">
                      <div className="h-left">
                        <span className="dot" />
                        <div>
                          <div className="t-mono" style={{ color: "var(--ink)" }}>{sec.name}</div>
                          <div className="t-body tnum">
                            Length: {sec.length} chars · Updated {sec.updated}
                          </div>
                        </div>
                      </div>
                      <div className="h-right">
                        {confirmDeleteSecret === sec.name ? (
                          <div className="row-actions">
                            <button
                              type="button"
                              className="mini-btn danger"
                              onClick={() => {
                                setSecrets(secrets.filter((s) => s.name !== sec.name));
                                setConfirmDeleteSecret(null);
                              }}
                            >
                              Confirm Delete
                            </button>
                            <button
                              type="button"
                              className="mini-btn"
                              onClick={() => setConfirmDeleteSecret(null)}
                            >
                              Cancel
                            </button>
                          </div>
                        ) : (
                          <button
                            type="button"
                            className="mini-btn danger"
                            onClick={() => setConfirmDeleteSecret(sec.name)}
                          >
                            Delete
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
