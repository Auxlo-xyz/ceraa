<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Ceraa</title>
<style>
  /* One accent, one grey family, one radius scale, one 4px spacing unit.
     Each is stated here so the values below can be checked against a rule
     rather than against taste. */
  :root {
    --bg: #000;
    --surface: #0c0c0c;
    --raised: #161616;
    --line: #1f1f1f;
    /* The one filled surface in the transcript: your own message. Distinct from
       --raised, which is a row lifted off a grey panel and resolves to the page
       colour in light, where it would erase the bubble entirely. */
    --fill: #1f1f1f;
    --text: #ededed;
    --muted: #8a8a8a;
    --faint: #5a5a5a;
    --accent: #3b6ff5;
    --accent-ink: #fff;
    --warn: #d9a441;
    --warn-bg: #17140d;
    --r-pill: 999px;
    --r-card: 16px;
    --r-input: 10px;
    --s: 4px;
    --tap: 44px;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: dark;
  }
  /* Light is a real theme, not an inversion: the same tokens resolve to light
     values and nothing below branches on the scheme. */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fff;
      --surface: #f7f7f7;
      --raised: #fff;
      --fill: #ebebeb;
      --line: #e6e6e6;
      --text: #111;
      --muted: #6b6b6b;
      --faint: #9a9a9a;
      --accent: #2f5fe0;
      --warn: #8a6212;
      --warn-bg: #fdf6e6;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* A tap is signalled by :active, so a keyboard or switch user needs the same
     signal. The accent ring is offset so it clears the hairline it marks. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* One disabled opacity for every control, so a control that cannot be used
     never looks like one that simply has not been pressed yet. */
  button:disabled { opacity: .5; cursor: default; }
  html, body { height: 100%; }
  /* The canvas itself is painted page background. If the webview ever shows
     area outside the body box (viewport resize, keyboard, overscroll), it
     must be black, never the client's default grey panel. */
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Chrome is a bare row of controls. A title competes with the content for the
     same attention, and the surface is one operator's own machine. */
  .bar {
    display: flex; align-items: center; gap: calc(var(--s) * 2);
    padding: calc(var(--s) * 2) calc(var(--s) * 3);
    padding-top: max(calc(var(--s) * 2), env(safe-area-inset-top));
    flex: none;
  }
  .icon {
    width: var(--tap); height: var(--tap);
    display: grid; place-items: center;
    border: 0; border-radius: var(--r-pill);
    background: none; color: var(--muted);
    cursor: pointer;
    transition: transform 120ms var(--ease), color 120ms var(--ease);
  }
  .icon:active { transform: scale(0.94); background: none; color: var(--text); }
  .icon svg { width: 20px; height: 20px; display: block; }
  .icon .badge {
    position: absolute; transform: translate(15px, -15px);
    min-width: 8px; height: 8px; border-radius: var(--r-pill);
    background: var(--accent);
  }
  .icon { position: relative; }

  /* Run state sits beside the connection dot rather than in the composer: it is
     a label about the conversation, and the pill is for writing. Kept in the DOM
     at all times because the script writes to it unconditionally.

     It is a pill rather than bare text because the phase has two channels: the
     dot carries it in colour, the words carry it in text. A reader who cannot
     separate the two still gets one of them, and neither needs a fill. */
  #state {
    font-size: 11px; line-height: 1; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px 5px 8px;
    border: 1px solid var(--line); border-radius: var(--r-pill);
    max-width: 44vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #state:empty { display: none; }
  #state::before {
    content: ""; flex: none; width: 6px; height: 6px;
    border-radius: 50%; background: currentColor;
  }
  #state[data-state="thinking"]::before { animation: breathe 1.3s ease-in-out infinite; }
  #state[data-state="working"] { color: var(--accent); }
  #state[data-state="working"]::before { animation: breathe .8s ease-in-out infinite; }
  #state[data-state="asking"] { color: var(--warn); }
  #state[data-state="error"] { color: var(--warn); border-color: var(--warn); }

  /* The mascot is the run state, not an ornament. It is a pure function of the
     same phase the pill reports, driven from one assignment, so the two can
     never disagree about what the run is doing — the same rule the terminal
     surface keeps (internal/tui/mascot.go: a run is a state machine and the
     mascot is a function of it).

     Its own black square is page-background in the dark theme and a badge in
     the light one, so one file serves both without a second copy. */
  #face {
    width: 26px; height: 26px; flex: none;
    display: block; border-radius: 7px; overflow: hidden;
    transform-origin: 50% 85%;
    transition: transform 300ms var(--ease), opacity 300ms var(--ease);
  }
  #face img { width: 100%; height: 100%; display: block; }
  #face[data-state="thinking"] { animation: bob 2.4s ease-in-out infinite; }
  #face[data-state="working"] { animation: bob 1.3s ease-in-out infinite; }
  #face[data-state="asking"] { transform: rotate(7deg); }
  #face[data-state="done"] { transform: rotate(-5deg); }
  #face[data-state="error"] { transform: rotate(5deg); opacity: .5; }

  .live { margin-left: auto; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: calc(var(--s) * 1.5); }
  .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .live.on { color: var(--accent); }

  /* Sessions live behind a sheet rather than in a permanent column. On a phone
     a permanent sidebar costs a third of the width for something looked at
     rarely, and the conversation is what the screen is for. */
  #list {
    position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw);
    background: var(--surface); border-right: 1px solid var(--line);
    transform: translateX(-100%);
    /* Closed means closed. The transform is how the sheet gets out of the way,
       but visibility is what guarantees it: a client that drops the transform,
       or a stylesheet that fails to parse it, leaves a full-height panel over
       the conversation with the control that opens it hidden behind. */
    visibility: hidden; pointer-events: none;
    transition: transform 300ms var(--ease), visibility 0s linear 300ms;
    overflow-y: auto; z-index: 30;
    padding-top: max(calc(var(--s) * 3), env(safe-area-inset-top));
  }
  #list[data-open="true"] {
    transform: none; visibility: visible; pointer-events: auto;
    box-shadow: 0 0 60px rgba(0,0,0,.5);
    transition: transform 300ms var(--ease), visibility 0s;
  }
  #scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 25;
    opacity: 0; pointer-events: none; transition: opacity 300ms var(--ease);
  }
  #scrim[data-open="true"] { opacity: 1; pointer-events: auto; }

  #list button {
    display: block; width: 100%; text-align: left;
    padding: calc(var(--s) * 3) calc(var(--s) * 4);
    background: none; border: 0; border-bottom: 1px solid var(--line);
    color: inherit; font: inherit; cursor: pointer;
  }
  #list button[aria-current="true"] { background: var(--raised); }
  #list button:active { background: var(--raised); }
  #list .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #list .empty { padding: calc(var(--s) * 4); }

  #open {
    flex: 1; overflow-y: auto; padding: 0 calc(var(--s) * 4);
    -webkit-overflow-scrolling: touch;
    /* Painted, not transparent: the transcript must never read as a grey
       panel floating between a black bar and a black composer. */
    background: var(--bg);
  }
  /* Belt and braces: the moment real content exists the resting screen is
     gone, even if a script path forgot to remove it. */
  #open:has(.msg, h2) .empty-center { display: none; }

  /* The resting screen is one centred thought, the way a chat that has said
     nothing yet should look rather than a layout waiting for content. */
  #open .empty {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--s) * 4); color: var(--muted); text-align: center; padding: 0 calc(var(--s) * 6);
  }
  .empty-center {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--s) * 4); color: var(--muted); text-align: center;
  }
  .empty-center p { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  .idle-mark { display: flex; align-items: center; gap: calc(var(--s) * 3); }
  .idle-mark i { width: 22px; height: 2px; border-radius: 2px; background: var(--line); }
  .idle-mark i:nth-child(2) { background: var(--accent); }
  .idle-hint { font-size: 13px; color: var(--faint); }

  #stats {
    display: flex; gap: calc(var(--s) * 6); flex-wrap: wrap;
    margin: calc(var(--s) * 4) 0;
    padding: 0 0 calc(var(--s) * 3);
  }
  #stats .k { font-size: 12px; color: var(--muted); }
  #stats .v { font-size: 16px; font-variant-numeric: tabular-nums; }

  .msg { margin-bottom: calc(var(--s) * 5); }
  .msg .body { white-space: pre-wrap; word-break: break-word; }

  /* The only message allowed a frame is your own. Right alignment and a fill
     are what say "you said this"; the reply needs neither because it is already
     the thing the whole screen is pointed at. The radius is 50% with a 32px
     ceiling, so one line closes into a pill and a paragraph opens into a
     rounded slab — one rule, both shapes, no second declaration. */
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .body {
    max-width: 84%;
    padding: calc(var(--s) * 3) calc(var(--s) * 5);
    background: var(--fill);
    border-radius: min(50%, calc(var(--s) * 8));
  }

  /* A tool call is a step in a run, so it is drawn as a step: one hairline
     node, one hairline rail to the next, and the output behind a single top
     hairline. No box and no fill anywhere — a filled box around every result
     is what made the transcript read as grey panels stacked on grey. */
  .tool {
    position: relative;
    padding-left: calc(var(--s) * 7);
    margin: calc(var(--s) * 4) 0 0;
  }
  .tool-node {
    position: absolute; left: 0; top: 3px;
    width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--bg);
  }
  .tool-node::after {
    content: ""; position: absolute; inset: 3px; border-radius: 50%;
    background: var(--faint);
  }
  .tool[data-s="running"] .tool-node { border-color: var(--accent); }
  .tool[data-s="running"] .tool-node::after {
    background: var(--accent); animation: breathe .9s ease-in-out infinite;
  }
  .tool[data-s="error"] .tool-node { border-color: var(--warn); }
  .tool[data-s="error"] .tool-node::after { background: var(--warn); }
  /* The rail is drawn by the step that is followed by another, so the line
     stops where the sequence does instead of trailing into the reply. */
  .tool:has(+ .tool)::after {
    content: ""; position: absolute; left: 7px; top: 22px; bottom: -20px;
    width: 1px; background: var(--line);
  }
  .tool-head { display: flex; align-items: center; gap: calc(var(--s) * 2); }
  .tool-name {
    font: 600 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
  }
  .tool-state {
    margin-left: auto; flex: none;
    font-size: 11px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tool-state::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
  }
  .tool[data-s="running"] .tool-state { color: var(--accent); }
  .tool[data-s="error"] .tool-state { color: var(--warn); }
  .tool-out {
    margin: calc(var(--s) * 2) 0 0; padding-top: calc(var(--s) * 2);
    border-top: 1px solid var(--line);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
    max-height: 22em; overflow: auto;
  }
  .tool-out[hidden] { display: none; }
  .tool-line { font-size: 13px; color: var(--muted); margin: calc(var(--s) * 2) 0; }

  /* The waiting indicator replaces a label: three dots that take turns, so the
     surface is visibly alive while nothing has been written yet. The stagger is
     the whole effect — without it the three pulse as one and read as a blink. */
  .thinking {
    display: flex; align-items: center; gap: calc(var(--s) * 2.5);
    color: var(--faint); font-size: 13px;
    margin: calc(var(--s) * 2) 0;
  }
  .thinking i {
    width: 5px; height: 5px; border-radius: 50%; background: currentColor;
    animation: bob 1.1s ease-in-out infinite;
  }
  .thinking i:nth-child(2) { animation-delay: .16s; }
  .thinking i:nth-child(3) { animation-delay: .32s; }
  .empty { color: var(--muted); }

  /* Markdown in assistant messages is type and hairlines, never panels: the
     flat-transcript rule still holds, so code and quotes get an edge each and
     no fills anywhere. */
  .body a { color: var(--accent); }
  .body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .92em;
  }
  .body pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; line-height: 1.5;
    border-left: 2px solid var(--line);
    padding-left: calc(var(--s) * 3); margin: calc(var(--s) * 2) 0;
    overflow-x: auto;
  }
  .body ul, .body ol { margin: calc(var(--s) * 2) 0; padding-left: calc(var(--s) * 5); }
  .body li { margin: 2px 0; }
  .body .mh1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: calc(var(--s) * 3) 0 calc(var(--s) * 1); }
  .body .mh2 { font-size: 17px; font-weight: 700; margin: calc(var(--s) * 3) 0 calc(var(--s) * 1); }
  .body .mh3, .body .mh4 { font-size: 15px; font-weight: 700; margin: calc(var(--s) * 3) 0 calc(var(--s) * 1); }
  .body .mq {
    border-left: 2px solid var(--line);
    padding-left: calc(var(--s) * 3); margin: calc(var(--s) * 2) 0;
    color: var(--muted);
  }
  .body table { border-collapse: collapse; margin: calc(var(--s) * 2) 0; font-size: 14px; display: block; overflow-x: auto; }
  .body th, .body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .body th { color: var(--muted); font-weight: 600; }
  .body .mhr { border-top: 1px solid var(--line); margin: calc(var(--s) * 3) 0; }

  /* The composer is one hairline pill on the page background, not a filled
     grey bar. A filled pill plus filled tool cards plus a filled sheet is
     where the stacked-greys look came from. */
  #composer {
    flex: none; display: flex; gap: calc(var(--s) * 2); align-items: flex-end;
    margin: 0 calc(var(--s) * 3);
    margin-bottom: max(calc(var(--s) * 3), env(safe-area-inset-bottom));
    padding: calc(var(--s) * 1.5);
    background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--r-pill);
  }
  #prompt {
    flex: 1; resize: none; border: 0; background: none; color: inherit;
    font: inherit; min-height: var(--tap); max-height: 30vh;
    padding: calc(var(--s) * 2.5) calc(var(--s) * 3);
  }
  #prompt:focus { outline: none; }
  #send {
    width: var(--tap); height: var(--tap); flex: none;
    border: 0; border-radius: var(--r-pill);
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; cursor: pointer;
    transition: transform 120ms var(--ease), opacity 120ms var(--ease);
  }
  #send:active { transform: scale(0.94); }
  #send svg { width: 20px; height: 20px; }
  #stop {
    width: var(--tap); height: var(--tap); flex: none;
    border: 0; border-radius: var(--r-pill); cursor: pointer;
    background: var(--warn-bg); color: var(--warn);
    display: grid; place-items: center;
    transition: transform 120ms var(--ease);
  }
  #stop:active { transform: scale(0.94); }
  #stop[hidden] { display: none; }
  #stop svg { width: 18px; height: 18px; }

  /* Settings and secrets are a task with steps, so they take the screen rather
     than floating over the conversation they will change. */
  #panel {
    position: fixed; inset: 0; z-index: 40; background: var(--bg);
    overflow-y: auto;
    padding: calc(var(--s) * 4) calc(var(--s) * 4);
    padding-top: max(calc(var(--s) * 4), env(safe-area-inset-top));
  }
  #panel[hidden] { display: none; }
  #panel > div { max-width: 560px; margin: 0 auto; }
  #panel h2 { font-size: 20px; margin: 0 0 calc(var(--s) * 5); letter-spacing: -0.01em; }
  #panel h3 { font-size: 13px; margin: calc(var(--s) * 7) 0 calc(var(--s) * 3); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .field { display: flex; gap: calc(var(--s) * 3); align-items: center; margin-bottom: calc(var(--s) * 3); }
  .field label { width: 140px; font-size: 13px; color: var(--muted); flex: none; }
  .field input[type=text] {
    flex: 1; min-width: 0; padding: calc(var(--s) * 2.5) calc(var(--s) * 3);
    border: 1px solid var(--line); border-radius: var(--r-input);
    background: var(--surface); color: inherit; font: inherit;
  }
  .field input[type=text]:focus { outline: none; border-color: var(--accent); }
  .field .ro { flex: 1; font-size: 14px; word-break: break-all; }
  .panel-row { display: flex; gap: calc(var(--s) * 2); margin-top: calc(var(--s) * 4); }
  #panel-msg { font-size: 13px; color: var(--accent); min-height: 18px; margin-top: calc(var(--s) * 3); }
  #secret-list { list-style: none; padding: 0; margin: 0; }
  #secret-list li {
    display: flex; gap: calc(var(--s) * 2); align-items: center;
    padding: calc(var(--s) * 2.5) 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  #secret-list li span { flex: 1; word-break: break-all; }

  /* Permission and question cards keep one thin warning edge and no fill:
     a tinted panel over the transcript was another grey layer. */
  .ask {
    border: 0; border-left: 3px solid var(--warn);
    border-radius: 0; background: none;
    padding: calc(var(--s) * 3) 0 calc(var(--s) * 3) calc(var(--s) * 4);
    margin: calc(var(--s) * 3) 0;
  }
  .ask-row { display: flex; gap: calc(var(--s) * 2); flex-wrap: wrap; margin-top: calc(var(--s) * 3); }
  .ask-btn {
    min-height: 36px; padding: 0 calc(var(--s) * 4);
    border: 1px solid var(--line); border-radius: var(--r-pill);
    background: none; color: inherit; font: inherit; font-size: 14px;
    cursor: pointer; transition: transform 120ms var(--ease);
  }
  .ask-btn:active { transform: scale(0.97); }
  .ask input {
    width: 100%; margin-top: calc(var(--s) * 2); padding: calc(var(--s) * 2.5) calc(var(--s) * 3);
    border: 1px solid var(--line); border-radius: var(--r-input);
    background: var(--surface); color: inherit; font: inherit;
  }


  /* No fixed overlays for the resting screen. The empty state lives inside
     #open as normal flow content, so there is never a translucent layer
     floating over the conversation. */


  /* --- Motion ---
     Everything here is under a second and either carries information or marks a
     state change. The frequency gate is applied first: nothing that happens a
     hundred times a day moves, and the parts that carry no information were
     deleted rather than given an effect. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  /* One lift, shared by the waiting dots and by the mascot. Both are the run
     state and neither moves for any other reason, so a reader learns to read
     this shape as "working" rather than as decoration. */
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* Messages and tool results rise in as they are appended, which is what
     streaming wants rather than one block that swaps. A fresh node runs this once
     on insertion, so nothing here re-fires while the same one is in place. */
  #open > * { animation: rise .34s var(--ease) both; }
  #stats, #open h2 { animation: fadeIn .3s ease both; }

  /* The resting mark is the whole point of that screen, and still it reads as
     dead. Giving the centre dash a slow pulse is the difference between "a place
     to write" and "a page that will not answer". */
  .idle-mark i:nth-child(2) { animation: breathe 1.9s ease-in-out infinite; }

  /* The live dot is state: a steady colour for an assumption, a breath for a
     measured one. That it changes when the state does is the feedback. */
  .live.on::before { animation: breathe 2.4s ease-in-out infinite; }

  /* Settings settle in from a small rise instead of snapping into the layout. */
  #panel { animation: fadeIn .22s ease both; }
  #panel > div { animation: rise .28s var(--ease) both; }

  /* No entrance choreography on the chrome itself: the bar and composer
     sliding in on load is what made the frame feel like layers arriving
     on top of each other. Messages still rise once on insertion. */

  /* Motion is a confirmation, not a performance. Under this budget the platform
     default is the right answer and the cheapest one. */
  @media (prefers-reduced-motion: reduce) {
    /* Transitions off, visibility still authoritative: reduced motion changes
       how the sheet arrives, never whether it is there. */
    * { transition: none !important; animation: none !important; }
    #list[data-open="true"] { transition: none !important; }
    /* The sheet keeps its transform. Reducing motion means it arrives without a
       slide, not that it is always there — pinning it open covers the
       conversation for anyone who has the setting on. */
  }
  @media (min-width: 860px) {
    /* A wide window has room for both, so the sheet becomes a real column. */
    #list { position: static; transform: none; width: 300px; flex: none; border-right: 1px solid var(--line); }
    #scrim { display: none; }
    body { flex-direction: row; }
    .bar { position: fixed; top: 0; left: 300px; right: 0; background: var(--bg); z-index: 20; }
    #open { padding-top: 60px; }
    #composer { width: min(760px, calc(100% - 340px)); margin-left: auto; margin-right: auto; }
  }
</style>
</head>
<body>
<div id="scrim" data-open="false"></div>

<nav id="list" data-open="false" aria-label="Sessions"><p class="empty">Loading sessions…</p></nav>

<div class="bar">
  <button class="icon" id="sessions" type="button" aria-label="Sessions">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <span id="face" data-state="idle"><img src="/mascot.svg" alt=""></span>
  <span id="state" role="status" aria-live="polite"></span>
  <span class="live" id="live">connecting</span>
  <button class="icon" id="gear" type="button" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5" stroke-linecap="round"/></svg>
  </button>
</div>

<section id="open"><div class="empty-center"><p>What are we working on?</p><span class="idle-mark"><i></i><i></i><i></i></span></div></section>

<div id="panel" hidden>
  <div>
    <h2>Settings</h2>
    <div id="settings-fields"></div>
    <div class="panel-row">
      <button class="ask-btn" id="settings-save" type="button">Save changes</button>
      <button class="ask-btn" id="panel-close" type="button">Close</button>
    </div>
    <div id="panel-msg"></div>

    <h3>Secrets</h3>
    <ul id="secret-list"></ul>
    <div class="field"><label for="secret-name">Name</label>
      <input type="text" id="secret-name" placeholder="OPENAI_KEY"></div>
    <div class="field"><label for="secret-value">Value</label>
      <input type="text" id="secret-value" placeholder="stored encrypted, never shown back"></div>
    <div class="panel-row">
      <button class="ask-btn" id="secret-add" type="button">Store secret</button>
    </div>
  </div>
</div>

<footer id="composer">
  <textarea id="prompt" rows="1" placeholder="What should Ceraa work on?"></textarea>
  <button id="stop" hidden aria-label="Stop">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
  </button>
  <button id="send" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  </button>
</footer>

<script>
(function () {
  // Every request carries the payload the page was opened with. Telegram puts
  // that payload in the URL fragment rather than the query string, and a browser
  // never sends a fragment to the server, so this is the first place the
  // credential exists at all. The query string is still read because /events
  // needs it: an EventSource cannot carry an Authorization header, so that one
  // request is built by hand. Everywhere else it goes in a header, which keeps
  // it out of any log that records URLs.
  var params = new URLSearchParams(location.search);
  var fragment = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var initData = params.get("initData") || fragment.get("tgWebAppData") || "";
  var listEl = document.getElementById("list");
  var openEl = document.getElementById("open");
  var liveEl = document.getElementById("live");

  function headers() {
    return initData ? { "Authorization": "tma " + initData } : {};
  }

  function fail(message) {
    listEl.textContent = "";
    var p = document.createElement("p");
    p.className = "empty";
    p.style.padding = "14px";
    p.textContent = message;
    listEl.appendChild(p);
  }

  if (!initData) {
    fail("This page has to be opened from Telegram, which is what supplies the " +
         "payload every request is checked against.");
    return;
  }

  function api(path) {
    return fetch(path, { headers: headers() }).then(function (res) {
      if (!res.ok) { throw new Error(path + " returned " + res.status); }
      return res.json();
    });
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  // Minimal markdown for assistant messages. The source is escaped first, so
  // nothing in a reply can become an element except what is built below, and
  // links are restricted to http(s). Unclosed constructs (a fence or bold
  // still open mid-stream) render as plain text until the closer arrives.
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function md(src) {
    var codes = [];
    function inline(s) {
      s = s.replace(/`([^`\n]+)`/g, function (m, g) {
        codes.push(g); return "\ue000" + (codes.length - 1) + "\ue000";
      });
      s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      s = s.replace(/(^|[^~\w])~~([^~\n]+)~~/g, "$1<del>$2</del>");
      s = s.replace(/\ue000(\d+)\ue000/g, function (m, g) {
        return "<code>" + codes[+g] + "</code>";
      });
      return s;
    }
    function cells(row) {
      return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|")
        .map(function (c) { return "<td>" + inline(c.trim()) + "</td>"; })
        .join("");
    }
    function headCells(row) {
      return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|")
        .map(function (c) { return "<th>" + inline(c.trim()) + "</th>"; })
        .join("");
    }
    function isSep(row) {
      return row.indexOf("|") >= 0 && /-/.test(row) &&
        /^[\s|:.-]+$/.test(row.replace(/^\s*\|/, "").replace(/\|\s*$/, ""));
    }
    function countCells(row) {
      return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").length;
    }
    var lines = esc(src).split("\n");
    var out = [];
    var i = 0;
    var inCode = false;
    var codeBuf = [];
    function flushCode() {
      // A fence still open at the end (mid-stream) is code up to here.
      out.push("<pre>" + codeBuf.join("\n") + "</pre>");
      codeBuf = [];
    }
    function textBlock(chunk) {
      var j = 0;
      // Plain lines run together with their newlines (pre-wrap keeps them);
      // block elements are flushed as their own nodes and joined with no
      // separator. A newline between </div> and <div> is a line box under
      // pre-wrap, which double-spaced every heading and list against its
      // margins.
      var plain = [];
      function flushPlain() {
        if (plain.length) { out.push(plain.join("\n")); plain = []; }
      }
      while (j < chunk.length) {
        var line = chunk[j];
        var head = line.match(/^(#{1,4})\s+(.*)$/);
        if (head) {
          flushPlain();
          out.push('<div class="mh' + head[1].length + '">' +
            inline(head[2]) + "</div>");
          j++;
        } else if (/^\s*---+\s*$/.test(line)) {
          flushPlain();
          out.push('<div class="mhr"></div>');
          j++;
        } else if (/^\s*[-*+]\s+/.test(line)) {
          flushPlain();
          var items = [];
          while (j < chunk.length && /^\s*[-*+]\s+/.test(chunk[j])) {
            items.push("<li>" +
              inline(chunk[j].replace(/^\s*[-*+]\s+/, "")) + "</li>");
            j++;
          }
          out.push("<ul>" + items.join("") + "</ul>");
        } else if (/^\s*\d+[.)]\s+/.test(line)) {
          flushPlain();
          var nums = [];
          while (j < chunk.length && /^\s*\d+[.)]\s+/.test(chunk[j])) {
            nums.push("<li>" +
              inline(chunk[j].replace(/^\s*\d+[.)]\s+/, "")) + "</li>");
            j++;
          }
          out.push("<ol>" + nums.join("") + "</ol>");
        } else if (/^&gt;/.test(line)) {
          flushPlain();
          var quote = [];
          while (j < chunk.length && /^&gt;/.test(chunk[j])) {
            quote.push(inline(chunk[j].replace(/^&gt;\s?/, "")));
            j++;
          }
          out.push('<div class="mq">' + quote.join("\n") + "</div>");
        } else if (line.indexOf("|") >= 0 && j + 1 < chunk.length &&
            isSep(chunk[j + 1]) &&
            countCells(chunk[j + 1]) === countCells(line)) {
          flushPlain();
          var rows = ["<tr>" + headCells(line) + "</tr>"];
          j += 2;
          while (j < chunk.length && chunk[j].indexOf("|") >= 0 &&
              countCells(chunk[j]) === countCells(line) &&
              chunk[j].trim() !== "") {
            rows.push("<tr>" + cells(chunk[j]) + "</tr>");
            j++;
          }
          out.push("<table>" + rows.join("") + "</table>");
        } else {
          plain.push(inline(line));
          j++;
        }
      }
      flushPlain();
    }
    var chunk = [];
    function flushText() {
      if (chunk.length) { textBlock(chunk); chunk = []; }
    }
    lines.forEach(function (line) {
      if (/^\s*```/.test(line)) {
        if (inCode) { inCode = false; flushCode(); }
        else { inCode = true; flushText(); }
        return;
      }
      if (inCode) { codeBuf.push(line); return; }
      chunk.push(line);
    });
    flushText();
    if (inCode) { flushCode(); }
    // Blocks carry their own margins; joining with a newline would add a
    // line box between every pair under .body's pre-wrap.
    return out.join("");
  }

  function stat(label, value) {
    var box = el("div");
    box.appendChild(el("div", "k", label));
    box.appendChild(el("div", "v", value));
    return box;
  }

  function money(usd, known) {
    return known ? "$" + usd.toFixed(4) : "unknown";
  }

  // Human words for the run statuses the store uses, so the pill reads as
  // English rather than as an enum. Anything unmapped is shown as it arrived,
  // because inventing a word for an unknown state is how a state gets missed.
  var TOOL_WORD = {
    pending: "waiting", running: "running", completed: "done",
    canceled: "cancelled", cancel_requested: "stopping"
  };

  // One card per tool call, built the same way whether it is replayed from the
  // transcript or announced by a live event. Two shapes for one thing is how
  // the two surfaces drift into disagreeing about what a step looks like.
  function toolCard(name, status) {
    var card = el("div", "tool");
    card.appendChild(el("span", "tool-node"));
    var head = el("div", "tool-head");
    head.appendChild(el("span", "tool-name", name || "tool"));
    head.appendChild(el("span", "tool-state"));
    card.appendChild(head);
    var out = el("pre", "tool-out");
    out.hidden = true;
    card.appendChild(out);
    setToolState(card, status || "completed");
    return card;
  }

  function setToolState(card, status) {
    var s = String(status || "").toLowerCase();
    var phase = !s || /pend|run/.test(s) ? "running"
              : /fail|error|cancel/.test(s) ? "error"
              : "done";
    card.dataset.s = phase;
    card.querySelector(".tool-state").textContent = TOOL_WORD[s] || s || "running";
  }

  // Tool output is program text: run paths, logs, exit output. It is set as
  // text and never parsed, so a log line containing markup stays a log line.
  function setToolOut(card, text) {
    var out = card.querySelector(".tool-out");
    out.textContent = text;
    out.hidden = !text;
  }

  function renderSummary(sessions) {
    listEl.textContent = "";
    if (!sessions.length) {
      fail("No sessions yet.");
      return;
    }
    sessions.forEach(function (session) {
      var button = el("button");
      button.appendChild(el("div", "title", session.title));
      button.appendChild(el("div", "meta", session.messages + " messages · " + session.runs + " runs"));
      button.addEventListener("click", function () {
        listEl.querySelectorAll("button").forEach(function (other) {
          other.setAttribute("aria-current", other === button ? "true" : "false");
        });
        open(session.id);
      });
      listEl.appendChild(button);
    });
  }

  function renderSession(session) {
    openEl.textContent = "";
    openEl.appendChild(el("h2", null, session.title));
    var stats = el("div");
    stats.id = "stats";
    stats.appendChild(stat("Context", "~" + session.context.estimated_tokens + " tok"));
    stats.appendChild(stat("Limit", session.context.limit ? session.context.limit.toLocaleString() : "unknown"));
    stats.appendChild(stat("Used", session.context.percent + "%"));
    stats.appendChild(stat("Cost", money(session.cost.total_usd, session.cost.known)));
    stats.appendChild(stat("Messages", String(session.context.messages)));
    openEl.appendChild(stats);

    if (!session.messages.length) {
      openEl.appendChild(el("p", "empty", "Nothing has been said yet."));
      return;
    }
    session.messages.forEach(function (message) {
      // The system prompt is instructions to the model, not part of the
      // conversation. The server already withholds it; this covers a surface
      // opened against an older build that still sends it.
      if (message.role === "system") { return; }
      var body = message.tool_result || message.content || "";
      if (message.tool_name) {
        var step = toolCard(message.tool_name, message.status);
        if (body) { setToolOut(step, body); }
        openEl.appendChild(step);
        return;
      }
      if (!body) { return; }
      // No label on either side. Who is holding the floor is already carried
      // by which side of the screen the text is on, and a row of repeated
      // "assistant" captions was grey noise between the two.
      var row = el("div", "msg" + (message.role === "user" ? " user" : ""));
      var box = el("div", "body");
      box.innerHTML = md(body);
      row.appendChild(box);
      openEl.appendChild(row);
    });
    // A freshly opened transcript starts at the top. Without this the pane
    // keeps whatever scroll offset the previous session left behind.
    openEl.scrollTop = 0;
  }

  function open(id) {
    api("/api/sessions/" + encodeURIComponent(id)).then(renderSession).catch(function (err) {
      openEl.textContent = "";
      openEl.appendChild(el("p", "empty", String(err)));
    });
  }

  api("/api/sessions").then(function (data) { renderSummary(data.sessions); })
    .catch(function (err) { fail(String(err)); });

  // A turn in progress, rendered where it happens rather than filed as a
  // message first: the transcript on disk is written by the runner and is read
  // back the next time the session is opened, not on this page's clock.
  var turnNode = null;
  var textBox = null;
  // The raw markdown of the turn in progress. Deltas arrive as plain text;
  // what is on screen is md(turnRaw), re-rendered as the source closes its
  // constructs — an unclosed fence or bold runs as literal text until the
  // closer arrives, so a partially streamed message never shows broken HTML.
  var turnRaw = "";
  var stateEl = document.getElementById("state");
  var faceEl = document.getElementById("face");
  var promptEl = document.getElementById("prompt");
  var sendEl = document.getElementById("send");
  var stopEl = document.getElementById("stop");
  // Learned from the reply to the first turn rather than assumed, so this page
  // still works if the surface is configured with a different session.
  var webSession = "";
  var running = false;

  // The phase is derived, never stored twice. `state` writes the words, and
  // the same input decides which of the six phases the pill's dot and the
  // mascot are showing — so the two cannot drift, and there is no second
  // assignment to forget when a new label is added.
  //
  // Anything unmapped that is not empty is a failure message, because the only
  // other strings this writes are caught errors.
  var PHASE = {
    "": "idle",
    sending: "thinking",
    streaming: "working",
    busy: "working",
    stopping: "working",
    awaiting: "asking",
    failed: "error"
  };

  function state(text) {
    stateEl.textContent = text;
    var phase = PHASE[text] || (text ? "error" : "idle");
    stateEl.dataset.state = phase;
    faceEl.dataset.state = phase;
  }

  // Send is a commitment, so it is available exactly when there is something
  // to send and nothing already running. An empty composer with a live button
  // was a control that did nothing when pressed, which reads as a broken one.
  function syncSend() {
    sendEl.disabled = running || !promptEl.value.trim();
  }

  function streaming(on) {
    running = on;
    stopEl.hidden = !on;
    if (!on) { state(""); }
    syncSend();
  }

  // An answered question is not the end of the run. Going straight to idle
  // after an approval left the pill reporting a run that was still going.
  function answered() {
    state(running ? "streaming" : "");
  }

  // Deltas arrive faster than a phone can re-parse the whole message, so the
  // repaint is coalesced into one frame and the final state is flushed when
  // the turn completes — otherwise the stream stutters and the last paint
  // could be a tick behind the "done" label.
  var paintTimer = null;
  var paintStick = false;
  function paint() {
    if (paintTimer) { return; }
    paintTimer = setTimeout(flushPaint, 50);
  }
  function flushPaint() {
    if (paintTimer) { clearTimeout(paintTimer); paintTimer = null; }
    if (textBox) { textBox.innerHTML = md(turnRaw); }
    // Stick after the repaint, not before: the repaint is what changes the
    // height, and a scroll issued earlier lands above the new content.
    if (paintStick) { paintStick = false; stick(); }
  }

  // The pane sticks to the bottom while a turn streams, but only if the
  // reader is already there: scrolled-up history is never yanked away.
  function nearBottom() {
    var open = document.getElementById("open");
    return open.scrollHeight - open.scrollTop - open.clientHeight < 120;
  }
  function stick() {
    var open = document.getElementById("open");
    open.scrollTop = open.scrollHeight;
  }

  function turn() {
    if (!turnNode) {
      turnNode = el("div", "msg");
      textBox = el("div", "body");
      turnRaw = "";
      turnNode.appendChild(textBox);
      var open = document.getElementById("open");
      // The resting screen is full-height flow content: leaving it in place
      // pushes the live turn below the fold, which is why messages showed up
      // cut off at the bottom behind the composer.
      var bare = open.querySelector(".empty-center");
      if (bare) { bare.remove(); }
      // Appended, not prepended. A new turn goes under what came before it;
      // inserting before the first message put answers above their questions.
      open.appendChild(turnNode);
      stick();
      // The turn exists before the model has said anything, so the surface has
      // to say that much. The indicator is what fills that gap.
      thinkingShow();
    }
    return turnNode;
  }

  // Between the send and the first delta the transcript is empty and the run is
  // invisible. Three dots taking turns is the whole of what a reader needs to
  // know that something is happening, and the stagger is what makes them read
  // as three rather than as one blinking.
  function thinkingShow() {
    if (!turnNode || turnNode.querySelector(".thinking")) { return; }
    var dots = el("div", "thinking");
    dots.appendChild(el("i"));
    dots.appendChild(el("i"));
    dots.appendChild(el("i"));
    dots.appendChild(el("span", null, "Ceraa is thinking"));
    turnNode.appendChild(dots);
  }

  function thinkingHide() {
    var dots = document.querySelector("#open .thinking");
    if (dots) { dots.remove(); }
  }

  var pending = null;

  function resetTurn() {
    if (pending) { pending.textContent = ""; pending = null; }
    if (paintTimer) { clearTimeout(paintTimer); paintTimer = null; }
    paintStick = false;
    turnNode = null;
    textBox = null;
    turnRaw = "";
  }

  // The turn node exists before the server has accepted the request, because
  // there is nowhere else to put what comes back. If the request is refused,
  // that node has no content and no run behind it, and keeping it shows a
  // permanent empty gap where an answer should be. It is dropped only while it
  // is still empty: a turn that has streamed anything is transcript.
  function dropEmptyTurn() {
    if (!turnNode || turnRaw || pending) { return; }
    if (paintTimer) { clearTimeout(paintTimer); paintTimer = null; }
    turnNode.remove();
    paintStick = false;
    turnNode = null;
    textBox = null;
    turnRaw = "";
  }

  // A request a run is stopped on gets rendered where it happens. The buttons
  // are the answer: the same POST the chat's buttons make, under the same id.
  function pendingBox() {
    turn();
    if (!pending) {
      pending = el("div");
      turnNode.appendChild(pending);
    }
    return pending;
  }

  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, headers()),
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (text) { throw new Error(text || String(res.status)); });
      }
      return true;
    }).catch(function (err) {
      state(String(err).trim());
      return false;
    });
  }

  function askPermission(d) {
    var card = el("div", "ask");
    card.appendChild(el("div", "tool-line", "Permission needed · " + (d.tool || "tool")));
    var row = el("div", "ask-row");
    [["allowOnce", "Allow once"], ["allowAlways", "Always"], ["deny", "Deny"]].forEach(function (choice) {
      var button = el("button", "ask-btn", choice[1]);
      button.addEventListener("click", function () {
        button.disabled = true;
        post("/api/permission", { request_id: d.request_id, decision: choice[0] })
          .then(function (ok) { if (ok) { card.remove(); answered(); } });
      });
      row.appendChild(button);
    });
    card.appendChild(row);
    pendingBox().appendChild(card);
  }

  function askQuestion(d) {
    var card = el("div", "ask");
    card.appendChild(el("div", "tool-line", (d.header ? d.header + " · " : "") + (d.question || "The model asked something")));
    var options = d.options || [];
    var row = el("div", "ask-row");
    options.forEach(function (option) {
      var button = el("button", "ask-btn", option);
      button.addEventListener("click", function () {
        button.disabled = true;
        post("/api/answer", { request_id: d.request_id, answer: option })
          .then(function (ok) { if (ok) { card.remove(); answered(); } });
      });
      row.appendChild(button);
    });
    // Free-form, or an option list the model never wrote: a value, a path and a
    // name are not things a row of buttons can hold, so there has to be a way
    // to type one.
    if (d.free_form || options.length === 0) {
      var input = document.createElement("input");
      input.placeholder = "Type an answer";
      var send = el("button", "ask-btn", "Answer");
      function reply() {
        var text = input.value.trim();
        if (!text) { return; }
        send.disabled = true;
        post("/api/answer", { request_id: d.request_id, answer: text })
          .then(function (ok) { if (ok) { card.remove(); answered(); } });
      }
      send.addEventListener("click", reply);
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") { event.preventDefault(); reply(); }
      });
      row.appendChild(input);
      row.appendChild(send);
    }
    if (options.length || d.free_form) { card.appendChild(row); }
    pendingBox().appendChild(card);
  }

  function submit() {
    var text = promptEl.value.trim();
    if (!text) { return; }
    // The question is echoed the moment it is asked. Until now only the
    // assistant's turn node was created here, so a sent query appeared
    // nowhere until the session was re-opened from the server transcript.
    var open = document.getElementById("open");
    var bare = open.querySelector(".empty-center");
    if (bare) { bare.remove(); }
      var you = el("div", "msg user");
      var youBody = el("div", "body");
      youBody.innerHTML = md(text);
      you.appendChild(youBody);
      open.appendChild(you);
      resetTurn();
      turn();
      // Claim the composer before the request leaves. Two taps while the
      // first is still in flight is a second run the server can only refuse.
      running = true;
      syncSend();
      state("sending");
      fetch("/prompt", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, headers()),
        body: JSON.stringify({ text: text })
      }).then(function (res) {
        if (res.status === 409) {
          // Nothing was started by this tap, so the optimistic turn has
          // nothing to become. Drop it rather than leave a permanent gap
          // where an answer should be; the run already going will stream.
          dropEmptyTurn();
          running = false;
          state("busy");
          syncSend();
          return null;
        }
        if (!res.ok) { return res.text().then(function (body) { throw new Error(body || res.status); }); }
        promptEl.value = "";
        state("streaming");
        streaming(true);
        return res.json();
      }).then(function (data) {
        if (data && data.session) { webSession = data.session; }
      }).catch(function (err) {
        state("failed");
        thinkingHide();
        running = false;
        syncSend();
        textBox && textBox.parentElement.appendChild(el("div", "tool-line", String(err)));
      });
    }

  stopEl.addEventListener("click", function () {
    if (!webSession) { return; }
    stopEl.disabled = true;
    fetch("/api/sessions/" + encodeURIComponent(webSession) + "/cancel", {
      method: "POST",
      headers: headers()
    }).then(function (res) {
      stopEl.disabled = false;
      // 409 means the run had already finished, which is the same outcome the
      // button wanted.
      if (!res.ok && res.status !== 409) { return res.text().then(function (t) { throw new Error(t || res.status); }); }
      state("stopping");
    }).catch(function (err) { stopEl.disabled = false; state(String(err).trim()); });
  });

  sendEl.addEventListener("click", submit);
  promptEl.addEventListener("input", syncSend);
  syncSend();
  promptEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      submit();
    }
  });

  function payload(event) {
    try { return JSON.parse(event.data).data || {}; } catch (_) { return {}; }
  }

  // Settings and secrets sit behind one panel because they are both "what this
  // install is", and a second page for the second half would mean two ways of
  // being admitted to the same surface.
  var panel = document.getElementById("panel");
  var panelMsg = document.getElementById("panel-msg");
  var fieldsEl = document.getElementById("settings-fields");
  var editable = ["provider", "model", "agent", "reasoning"];
  var checkboxKey = "auto_compaction";

  function say(text) { panelMsg.textContent = text; }

  function renderSettings(settings) {
    fieldsEl.textContent = "";
    editable.forEach(function (key) {
      var field = el("div", "field");
      field.appendChild(el("label", null, key.replace("_", " ")));
      var input = document.createElement("input");
      input.type = "text";
      input.dataset.key = key;
      input.value = settings[key] || "";
      field.appendChild(input);
      fieldsEl.appendChild(field);
    });
    var field = el("div", "field");
    field.appendChild(el("label", null, checkboxKey.replace("_", " ")));
    var box = document.createElement("input");
    box.type = "checkbox";
    box.dataset.key = checkboxKey;
    box.checked = !!settings[checkboxKey];
    field.appendChild(box);
    fieldsEl.appendChild(field);
    ["provider_name", "provider_model", "workspace", "session"].forEach(function (key) {
      if (settings[key] === undefined) { return; }
      var row = el("div", "field");
      row.appendChild(el("label", null, key.replace("_", " ")));
      row.appendChild(el("span", "ro", String(settings[key])));
      fieldsEl.appendChild(row);
    });
  }

  function loadSettings() {
    api("/api/settings").then(function (data) { renderSettings(data.settings); })
      .catch(function (err) { say(String(err)); });
  }

  function saveSettings() {
    var update = {};
    fieldsEl.querySelectorAll("[data-key]").forEach(function (input) {
      if (input.type === "checkbox") { update[input.dataset.key] = input.checked; return; }
      if (input.value.trim() !== "") { update[input.dataset.key] = input.value.trim(); }
    });
    if (!Object.keys(update).length) { say("nothing to save"); return; }
    post("/api/settings", { settings: update }).then(function (ok) {
      if (ok) { say("saved"); loadSettings(); }
    });
  }

  function renderSecrets(names) {
    var list = document.getElementById("secret-list");
    list.textContent = "";
    if (!names.length) {
      list.appendChild(el("li", "empty", "No secrets stored."));
      return;
    }
    names.forEach(function (name) {
      var row = el("li");
      row.appendChild(el("span", null, name));
      var drop = el("button", "ask-btn", "Delete");
      drop.addEventListener("click", function () {
        drop.disabled = true;
        fetch("/api/secrets/" + encodeURIComponent(name), { method: "DELETE", headers: headers() })
          .then(function (res) { if (!res.ok) { throw new Error(res.status); } return res.json(); })
          .then(function () { loadSecrets(); })
          .catch(function (err) { drop.disabled = false; say(String(err)); });
      });
      row.appendChild(drop);
      list.appendChild(row);
    });
  }

  function loadSecrets() {
    api("/api/secrets").then(function (data) { renderSecrets(data.secrets || []); })
      .catch(function (err) { say(String(err)); });
  }

  function addSecret() {
    var name = document.getElementById("secret-name").value.trim();
    var value = document.getElementById("secret-value").value;
    if (!name) { say("name is empty"); return; }
    fetch("/api/secrets/" + encodeURIComponent(name), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, headers()),
      body: JSON.stringify({ value: value })
    }).then(function (res) {
      if (!res.ok) { return res.text().then(function (t) { throw new Error(t || res.status); }); }
      document.getElementById("secret-name").value = "";
      document.getElementById("secret-value").value = "";
      say("stored");
      loadSecrets();
    }).catch(function (err) { say(String(err).trim()); });
  }

  document.getElementById("gear").addEventListener("click", function () {
    panel.hidden = false;
    say("");
    loadSettings();
    loadSecrets();
  });
  document.getElementById("panel-close").addEventListener("click", function () { panel.hidden = true; });
  document.getElementById("settings-save").addEventListener("click", saveSettings);
  document.getElementById("secret-add").addEventListener("click", addSecret);

  // Two transports carry the same events, and the page picks the one the path
  // in front of it actually supports. A proxy can hold a response until it
  // completes, which turns a stream that never completes into a response that
  // never arrives, so the stream says hello the moment it is able to and the
  // page stops waiting for it if that does not happen. What is asked for
  // instead is a batch, because a batch is a response that ends, and a
  // response that ends arrives everywhere.
  var cursor = -1;
  var streamLive = false;
  var source = null;
  // The step in flight, keyed by call id rather than by tool name: two
  // consecutive calls of the same tool would otherwise both land on the first
  // card, and the second would overwrite a step that had already finished.
  var lastTool = null;

  // One place decides what an event does, so the two transports cannot drift
  // into disagreeing about what a permission or a finished turn looks like.
  function dispatch(type, data) {
    var d = data || {};
    // Captured before the event renders: streaming text must keep the latest
    // line above the composer, without dragging a reader who scrolled up.
    var keep = nearBottom();
    switch (type) {
      case "permission":
        liveEl.textContent = "permission pending";
        liveEl.className = "live on";
        state("awaiting");
        askPermission(d);
        break;
      case "question":
        liveEl.textContent = "question pending";
        liveEl.className = "live on";
        state("awaiting");
        askQuestion(d);
        break;
      // A delta rather than the whole text, so a reader that joins midway
      // still accumulates correctly from what it saw.
      case "content":
        turn();
        thinkingHide();
        turnRaw += d.delta || "";
        paintStick = keep;
        paint();
        break;
      case "thinking":
        turn();
        thinkingShow();
        break;
      // A step: announced when it starts, settled when it ends. While a tool
      // runs the surface is working, not waiting, so the waiting dots go.
      case "tool_start":
        turn();
        thinkingHide();
        lastTool = { id: d.call_id, card: toolCard(d.tool || "tool", "running") };
        turnNode.appendChild(lastTool.card);
        break;
      case "tool_end":
        turn();
        var step = lastTool && lastTool.id === d.call_id ? lastTool.card : null;
        if (!step) {
          step = toolCard(d.tool || "tool");
          turnNode.appendChild(step);
        }
        setToolState(step, d.status || d.outcome);
        lastTool = null;
        break;
      case "complete":
        flushPaint();
        thinkingHide();
        streaming(false);
        lastTool = null;
        break;
      case "error":
        streaming(false);
        state("failed");
        thinkingHide();
        lastTool = null;
        turn().appendChild(el("div", "tool-line", d.message || "run failed"));
        break;
      // The buffer aged out from under this page, so the transcript on disk is
      // ahead of what has been rendered here. Re-read it rather than keep the
      // gap where a message should be.
      case "stale":
        if (webSession) { open(webSession); }
        break;
    }
    if (keep) { stick(); }
  }

  var watched = ["permission", "question", "content", "thinking",
                 "tool_start", "tool_end", "complete", "error", "stale"];

  function attach() {
    // EventSource cannot set a header, so the payload goes in the query string
    // for this one request. Everything else uses Authorization.
    var url = "/events?initData=" + encodeURIComponent(initData);
    if (cursor >= 0) { url += "&after=" + cursor; }
    source = new EventSource(url);
    source.onopen = function () { liveEl.textContent = "live"; liveEl.className = "live on"; };
    source.onerror = function () { liveEl.textContent = "reconnecting"; liveEl.className = "live"; };
    source.addEventListener("hello", function (event) {
      streamLive = true;
      var d = {};
      try { d = JSON.parse(event.data) || {}; } catch (_) {}
      if (typeof d.seq === "number") { cursor = d.seq; }
    });
    watched.forEach(function (type) {
      source.addEventListener(type, function (event) {
        // A dropped connection also surfaces as an "error", carrying nothing.
        // Only the one with a payload belongs to the run.
        if (type === "error" && !event.data) { return; }
        var id = parseInt(event.lastEventId, 10);
        if (!isNaN(id)) { cursor = id; }
        dispatch(type, payload(event));
      });
    });
    // If the hello has not arrived, the path is holding the response back and
    // waiting longer will not change that. The batch reader starts instead of
    // sitting out a timeout that cannot be observed from this side.
    setTimeout(function () {
      if (streamLive) { return; }
      source.close();
      poll();
    }, 2500);
  }

  function poll() {
    var url = "/api/events?wait=20000";
    if (cursor >= 0) { url += "&after=" + cursor; }
    api(url).then(function (data) {
      if (typeof data.seq === "number") { cursor = data.seq; }
      if (data.stale) { dispatch("stale", {}); }
      (data.events || []).forEach(function (one) {
        if (!one || !one.event) { return; }
        cursor = one.seq;
        dispatch(one.event.type, one.event.data);
      });
      liveEl.textContent = "live";
      liveEl.className = "live on";
      poll();
    }).catch(function () {
      liveEl.textContent = "reconnecting";
      liveEl.className = "live";
      setTimeout(poll, 1500);
    });
  }

  attach();
})();
</script>

<script>
// Appended, not woven in, except for the behaviour fixes above (message
// order, the echoed question, the removed resting screen, stick-to-bottom):
// those had to change how the transcript renders, so they live where the
// transcript is built rather than in a layer on top of it.
(function () {
  var list = document.getElementById("list");
  var scrim = document.getElementById("scrim");
  var trigger = document.getElementById("sessions");

  function sheet(on) {
    list.setAttribute("data-open", on ? "true" : "false");
    scrim.setAttribute("data-open", on ? "true" : "false");
  }
  if (trigger) {
    trigger.addEventListener("click", function () {
      sheet(list.getAttribute("data-open") !== "true");
    });
  }
  if (scrim) { scrim.addEventListener("click", function () { sheet(false); }); }

  // Selecting a session should close the sheet, because the thing it covered is
  // the thing the tap was for. The click is caught on the list rather than on
  // each row, so a row rebuilt by the fetch is still covered.
  if (list) {
    list.addEventListener("click", function (event) {
      if (event.target.closest("button")) { sheet(false); }
    });
  }
})();
</script>
</body>
</html>
