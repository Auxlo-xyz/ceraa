<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ceraa — Dashboard</title>
  <meta name="description" content="Ceraa control plane: provider profiles, reasoning effort, memory half-life, encrypted secret store, session ledger, and token cache telemetry." />
  <meta property="og:title" content="Ceraa — Control Plane & Telemetry" />
  <meta property="og:description" content="Ceraa control plane: provider profiles, reasoning effort, memory half-life, encrypted secret store, session ledger, and token cache telemetry." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
     * CERAA FOLIO DESIGN SYSTEM (Daylight Architectural / Swiss Broadsheet)
     * Exact warm paper & burnt sienna palette (#B83A08)
     * Fluid responsive 6-step typographic hierarchy + zero horizontal overflow
     * ========================================================================= */
    :root {
      --sf: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --serif: "Newsreader", Georgia, serif;

      --ground: #F6F4EF;       /* Warm museum paper */
      --well: #ECE8DF;         /* Recessed control well */
      --well-hover: #E3DEC3;
      --ink: #121110;          /* Deep carbon ink */
      --ink-2: #524E46;        /* Secondary warm umber */
      --ink-3: #6B665E;        /* Muted taupe index */
      --rule: #D8D3C8;         /* 1px architectural hairline */
      --rule-strong: #121110;  /* Primary structural rule */
      --accent: #B83A08;       /* Burnt sienna / vermilion (#B83A08) */
      --fault: #A81E14;        /* Semantic fault crimson */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--sf);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      /* No blue flash on tap: mobile WebKit paints its own highlight over
         every tap, and the dashboard already answers taps with its own
         pressed and selected states. */
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
    }

    .tnum { font-variant-numeric: tabular-nums; }

    /* =========================================================================
     * 6-STEP TYPOGRAPHY SCALE (56/44, 24/21, 18, 15, 13, 12)
     * ========================================================================= */
    .t-hero {
      font-family: var(--sf);
      font-size: clamp(42px, 5vw, 56px);
      font-weight: 800;
      line-height: 0.94;
      letter-spacing: -0.04em;
      color: var(--ink);
    }
    .t-display {
      font-family: var(--serif);
      font-size: clamp(20px, 2.2vw, 24px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .t-sec {
      font-family: var(--sf);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.015em;
      color: var(--ink);
    }
    .t-row {
      font-family: var(--sf);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.01em;
      color: var(--ink);
      word-break: break-word;
    }
    .t-body {
      font-family: var(--sf);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-2);
      word-break: break-word;
    }
    .t-mono {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.02em;
      color: var(--ink-2);
      word-break: break-word;
    }

    /* =========================================================================
     * SHELL & ARCHITECTURAL MASTHEAD
     * ========================================================================= */
    .shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: 36px 44px 64px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    @media (max-width: 1024px) {
      .shell {
        padding: 28px 28px 56px;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 20px 18px 116px; /* Bottom clearance for floating capsule dock */
      }
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--rule-strong);
      flex-wrap: wrap;
    }

    .masthead-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1;
    }
    .brand-title em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    /* The Dashboard wordmark: same 28px box as the serif title, but set in
       the Bricolage Grotesque sans at 600 in ink black to match the IDLE hero
       unit beside the run count. */
    .brand-title .brand-sans {
      font-family: var(--sf);
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: var(--well);
      border-radius: 999px;
      border: 1px solid var(--rule);
    }

    .masthead-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .masthead {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        padding-bottom: 18px;
      }
      .masthead-controls {
        width: 100%;
        justify-content: space-between;
        gap: 10px;
      }
      .desktop-tabs {
        display: none !important;
      }
      .provider-field {
        flex: 1;
        min-width: 0;
      }
      .provider-field select {
        width: 100%;
        text-overflow: ellipsis;
      }
    }

    .field-inline {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* The provider label must never wrap: a two-line PROVID/ER squeezes the
       select beside it. The label keeps its width, the select takes the rest
       and ellipsizes a long "name (model)" instead of pushing the row wider. */
    .provider-field {
      flex: 1 1 auto;
      min-width: 0;
    }
    .provider-field > span {
      flex: none;
      white-space: nowrap;
    }
    .provider-field select {
      flex: 1 1 auto;
      min-width: 0;
      text-overflow: ellipsis;
    }

    .input-clean {
      background: var(--well);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      border: 1px solid var(--rule);
      max-width: 100%;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .input-clean:focus {
      border-color: var(--accent);
      background: var(--ground);
    }

    /* Floating Capsule Icon Navbar (matches uploaded reference image) */
    .capsule-dock {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #FDFBF7;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(216, 211, 200, 0.75);
      box-shadow: 0 12px 32px rgba(18, 17, 16, 0.08), 0 2px 6px rgba(18, 17, 16, 0.04);
    }
    .capsule-nav-item {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #8C867B;
      cursor: pointer;
      position: relative;
      transition: background 0.22s cubic-bezier(0.2, 0.9, 0.3, 1), color 0.2s ease, transform 0.18s ease;
    }
    .capsule-nav-item:hover {
      color: var(--ink);
    }
    .capsule-nav-item.active {
      background: rgba(184, 58, 8, 0.12);
      color: var(--accent);
    }
    .capsule-nav-item:active {
      transform: scale(0.94);
    }

    /* Fixed Bottom Floating Capsule Dock for Mobile & Tablet (<768px) */
    .mobile-capsule-wrapper {
      display: none;
    }
    @media (max-width: 768px) {
      .mobile-capsule-wrapper {
        display: flex;
        justify-content: center;
        position: fixed;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        left: 0;
        right: 0;
        pointer-events: none;
        z-index: 260;
      }
      .mobile-capsule-wrapper .capsule-dock {
        pointer-events: auto;
        width: min(316px, calc(100vw - 40px));
        padding: 8px 12px;
        background: rgba(253, 251, 247, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 16px 40px rgba(18, 17, 16, 0.14), 0 3px 10px rgba(18, 17, 16, 0.06);
      }
      .mobile-capsule-wrapper .capsule-nav-item {
        width: 52px;
        height: 52px;
      }
    }

    /* Four-Boxes Grid Menu Button & Popover */
    .grid-menu-wrap {
      position: relative;
      flex: none;
    }
    .grid-menu-btn {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: var(--well);
      border: 1px solid var(--rule);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }
    .grid-menu-btn:hover,
    .grid-menu-btn.open {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--ground);
    }
    .grid-menu-popover {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(310px, calc(100vw - 36px));
      background: var(--ground);
      border: 1.5px solid var(--rule-strong);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 44px rgba(18, 17, 16, 0.14);
      z-index: 300;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, visibility 160ms ease;
    }
    .grid-menu-popover.open {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }
    .grid-menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .grid-menu-tile {
      padding: 12px;
      border-radius: 8px;
      background: var(--well);
      border: 1px solid transparent;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .grid-menu-tile:hover,
    .grid-menu-tile.active {
      border-color: var(--accent);
      background: var(--ground);
    }

    /* =========================================================================
     * 3-COLUMN ARCHITECTURAL BOARD (Generous Breathing Room & Mobile Stack)
     * ========================================================================= */
    .board {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr) 390px;
      flex: 1;
      border-bottom: 1px solid var(--rule);
    }

    @media (max-width: 1220px) {
      .board {
        grid-template-columns: 1fr 1fr;
      }
      .col-left {
        padding-right: 28px !important;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .col-center {
        padding-left: 28px !important;
        padding-right: 0 !important;
        border-right: none !important;
        border-bottom: 1px solid var(--rule);
      }
      .col-right {
        grid-column: 1 / -1;
        padding-left: 0 !important;
      }
    }

    @media (max-width: 820px) {
      .board {
        grid-template-columns: 1fr;
      }
      .col, .col-left, .col-center, .col-right {
        padding: 28px 0 !important;
        border-right: none !important;
        border-bottom: 1px solid var(--rule);
      }
      .col:last-child {
        border-bottom: none;
      }
    }

    .col {
      display: flex;
      flex-direction: column;
      padding: 36px 0;
      min-width: 0;
    }
    .col-left {
      padding-right: 38px;
      border-right: 1px solid var(--rule);
    }
    .col-center {
      padding-left: 42px;
      padding-right: 42px;
      border-right: 1px solid var(--rule);
    }
    .col-right {
      padding-left: 38px;
    }

    /* Hero Band inside each Column */
    .hero-band {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-bottom: 26px;
      border-bottom: 1px solid var(--rule);
      min-height: 112px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero-unit {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--accent);
      margin-left: 10px;
    }

    /* Section Header */
    .sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 32px;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sec-head:first-of-type {
      margin-top: 26px;
    }

    .action-link {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      padding: 4px 0;
    }
    .action-link:hover {
      text-decoration: underline;
    }

    /* Clean Hairline Rows */
    .hairline-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--rule);
    }

    .h-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 13px 8px;
      border-bottom: 1px solid var(--rule);
      gap: 14px;
      transition: background 0.14s ease;
    }
    .h-row.clickable {
      cursor: pointer;
    }
    .h-row.clickable:hover,
    .h-row:hover {
      background: rgba(18, 17, 16, 0.024);
    }
    .h-row.active-row {
      background: rgba(184, 58, 8, 0.055);
    }

    @media (max-width: 560px) {
      .h-row.stack-mobile {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 4px;
      }
      .h-row.stack-mobile .h-right {
        margin-left: 20px;
        width: calc(100% - 20px);
        justify-content: space-between;
      }
    }

    .h-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .h-left .dot {
      margin-top: 6px;
    }

    .h-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
    }

    /* Precision LEDs */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex: none;
    }
    .dot.idle {
      background: transparent;
      border: 1.75px solid var(--ink-3);
    }
    .dot.done {
      background: var(--ink-2);
    }
    .dot.fault {
      background: var(--fault);
    }

    /* Tactile Mechanical Switch */
    .switch {
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: var(--well);
      border: 1px solid var(--rule);
      position: relative;
      cursor: pointer;
      flex: none;
      transition: background 0.18s ease, border-color 0.18s ease;
    }
    .switch.on {
      background: var(--accent);
      border-color: var(--accent);
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ink);
      transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1), background 0.18s ease;
    }
    .switch.on::after {
      transform: translateX(18px);
      background: var(--ground);
    }

    /* Filter Bar / Sub-navigation */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .filter-item {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      cursor: pointer;
      padding-bottom: 5px;
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .filter-item:hover {
      color: var(--ink);
    }
    .filter-item.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    /* Subtle Action Buttons */
    .row-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .mini-btn {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--well);
      border: 1px solid var(--rule);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    .mini-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--ground);
    }
    .mini-btn.danger {
      color: var(--fault);
    }
    .mini-btn.danger:hover {
      background: var(--fault);
      border-color: var(--fault);
      color: var(--ground);
    }
    .mini-btn.stop-btn {
      background: var(--fault);
      border-color: var(--fault);
      color: var(--ground);
      padding: 7px 14px;
    }
    .mini-btn.stop-btn:hover {
      opacity: 0.9;
    }

    /* Inline Form Drawer */
    .drawer-form {
      display: flex;
      gap: 8px;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-solid {
      background: var(--ink);
      color: var(--ground);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-solid:hover {
      background: var(--accent);
    }

    /* 2x2 Architectural Readout Grid */
    .telem-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-top: 18px;
    }
    .telem-cell {
      padding: 16px 0;
      min-width: 0;
    }
    .telem-cell:nth-child(odd) {
      padding-right: 16px;
      border-right: 1px solid var(--rule);
    }
    .telem-cell:nth-child(even) {
      padding-left: 16px;
    }
    .telem-cell:nth-child(1),
    .telem-cell:nth-child(2) {
      border-bottom: 1px solid var(--rule);
    }

    /* Segmented Pill Selector for 3-way choices */
    .seg-group {
      display: inline-flex;
      background: var(--well);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--rule);
      gap: 2px;
      flex-wrap: wrap;
    }
    .seg-item {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      color: var(--ink-2);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .seg-item.active {
      background: var(--ground);
      color: var(--accent);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    /* Monospace Path Box (Wrap cleanly on mobile) */
    .path-well {
      padding: 12px 14px;
      background: var(--well);
      border: 1px solid var(--rule);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      word-break: break-all;
    }

    /* Error / Notice Callout */
    .notice-bar {
      padding: 12px 14px;
      border-left: 3px solid var(--fault);
      background: rgba(168, 30, 20, 0.06);
      border-radius: 0 6px 6px 0;
      margin: 10px 0;
      animation: fadeSlideUp 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* =========================================================================
     * INTERACTIVE ANIMATIONS, KEYFRAMES & TOKEN CONSUMPTION CHART
     * ========================================================================= */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseHalo {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(184, 58, 8, 0.45);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(184, 58, 8, 0);
      }
    }

    .board {
      animation: fadeSlideUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .dot:not(.idle):not(.done):not(.fault) {
      animation: pulseHalo 2.4s infinite ease-in-out;
    }

    .rotary-needle {
      transition: transform 0.48s cubic-bezier(0.22, 1.25, 0.36, 1);
      transform-origin: 40px 34px;
    }

    .gauge-ring {
      transition: stroke-dashoffset 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .h-row {
      transition: background 0.16s ease, transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .h-row.clickable:active {
      transform: scale(0.992);
    }

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    window.CeraaApi = (function () {
      function initData() {
        try {
          var w = window.Telegram && window.Telegram.WebApp;
          if (w && w.initData) return w.initData;
        } catch (e) {}
        try {
          var hash = window.location.hash || "";
          var key = "tgWebAppData=";
          var idx = hash.indexOf(key);
          if (idx >= 0) {
            var frag = hash.substring(idx + key.length);
            var amp = frag.indexOf("&");
            return decodeURIComponent(amp >= 0 ? frag.substring(0, amp) : frag);
          }
        } catch (e2) {}
        return "";
      }
      function call(path, method, body) {
        var headers = {};
        var data = initData();
        if (data) headers["Authorization"] = "tma " + data;
        var opts = { method: method || "GET", headers: headers };
        if (body !== undefined) {
          headers["Content-Type"] = "application/json";
          opts.body = JSON.stringify(body);
        }
        return fetch(path, opts).then(function (res) {
          return res.text().then(function (text) {
            var parsed = null;
            try { parsed = text ? JSON.parse(text) : null; } catch (e) {}
            if (!res.ok) {
              var err = new Error(text || ("request failed " + res.status));
              err.status = res.status;
              throw err;
            }
            return parsed;
          });
        });
      }
      function relTime(iso) {
        if (!iso) return "";
        var t = new Date(iso).getTime();
        if (isNaN(t)) return String(iso);
        var mins = Math.max(0, Math.round((Date.now() - t) / 60000));
        if (mins < 1) return "just now";
        if (mins < 60) return mins + "m ago";
        var hours = Math.round(mins / 60);
        if (hours < 48) return hours + "h ago";
        return Math.round(hours / 24) + "d ago";
      }
      function fmtK(n) {
        n = Number(n) || 0;
        if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k";
        return String(n);
      }
      function fmtBytes(n) {
        n = Number(n) || 0;
        if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
        if (n >= 1024) return (n / 1024).toFixed(1) + " KB";
        return n + " B";
      }
      // Credential probe, run before React and Babel even load. The full
      // dashboard takes seconds to boot (CDN scripts, JSX compile, a dozen API
      // calls), and without credentials every one of those calls fails: the
      // page would render an empty dashboard first and the locked screen
      // second. One cheap status call decides up front; denied renders a
      // static splash now, which React replaces with the identical screen
      // when it boots.
      function lockedSplash() {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="max-width:460px;margin:12vh auto 0;text-align:center;padding:0 24px;">' +
          '<div class="t-mono" style="letter-spacing:0.2em;">CERAA · PRIVATE</div>' +
          '<div class="t-display" style="margin-top:12px;">This dashboard is locked</div>' +
          '<div class="t-body" style="margin-top:12px;">It only opens from the Ceraa Telegram bot.</div>' +
          '</div>';
      }
      try {
        var headers = {};
        var data = initData();
        if (data) headers["Authorization"] = "tma " + data;
        fetch("/api/status", { headers: headers }).then(function (res) {
          if (res.status === 401 || res.status === 403) {
            window.__CERAA_DENIED = true;
            lockedSplash();
          }
          return null;
        }).catch(function () {});
      } catch (e) {}
      return { initData: initData, call: call, relTime: relTime, fmtK: fmtK, fmtBytes: fmtBytes };
    })();
  </script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const Api = window.CeraaApi;

    // =========================================================================
    // SMOOTH ANIMATED NUMBER COUNTER HOOK & COMPONENT
    // =========================================================================
    function useAnimatedNumber(target, duration = 620) {
      const [val, setVal] = useState(target);
      const prevRef = useRef(target);

      useEffect(() => {
        const startVal = Number(prevRef.current) || 0;
        const endVal = Number(target) || 0;
        if (startVal === endVal) {
          setVal(endVal);
          return;
        }
        let rafId;
        const startTime = performance.now();

        const tick = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          // Ease out quart
          const eased = 1 - Math.pow(1 - progress, 4);
          const current = startVal + (endVal - startVal) * eased;
          setVal(current);
          if (progress < 1) {
            rafId = requestAnimationFrame(tick);
          } else {
            prevRef.current = endVal;
          }
        };

        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [target, duration]);

      return val;
    }

    function AnimatedNumber({ value, decimals = 0, prefix = "", suffix = "", padStart = 0, locale = false }) {
      const animated = useAnimatedNumber(value);
      let formatted;
      if (decimals > 0) {
        formatted = animated.toFixed(decimals);
      } else {
        const rounded = Math.round(animated);
        formatted = locale ? rounded.toLocaleString() : String(rounded);
        if (padStart > 0) {
          formatted = String(rounded).padStart(padStart, "0");
        }
      }
      return (
        <span>
          {prefix}
          {formatted}
          {suffix}
        </span>
      );
    }

    // STYLISH INTERACTIVE TOKEN CONSUMPTION STACKED BAR CHART COMPONENT
    // =========================================================================
    function TokenConsumptionChart({ timeframe, setTimeframe, buckets }) {
      const [hoverIdx, setHoverIdx] = useState(null);
      const pts = buckets && buckets.length
        ? buckets
        : [{ label: "—", cacheRead: 0, input: 0, output: 0, cacheWrite: 0 }];

      const maxTotal = useMemo(() => {
        return Math.max(
          ...pts.map((p) => p.cacheRead + p.input + p.output + p.cacheWrite),
          1
        );
      }, [pts]);

      const activePoint = hoverIdx !== null && pts[hoverIdx] ? pts[hoverIdx] : pts[pts.length - 1];
      const activeTotalK = activePoint.cacheRead + activePoint.input + activePoint.output + activePoint.cacheWrite;

      const W = 340;
      const H = 136;
      const padT = 14;
      const padB = 22;
      const plotH = H - padT - padB;

      return (
        <div className="token-chart-card">
          <div className="token-chart-header">
            <div className="seg-group" role="tablist" aria-label="Token consumption timeframe">
              {[
                { id: "1d", label: "1d" },
                { id: "7d", label: "7d" },
                { id: "30d", label: "30d" },
                { id: "All", label: "All time" }
              ].map((tf) => (
                <button
                  key={tf.id}
                  type="button"
                  onClick={() => {
                    setTimeframe(tf.id);
                    setHoverIdx(null);
                  }}
                  className={`seg-item ${timeframe === tf.id ? "active" : ""}`}
                >
                  {tf.label}
                </button>
              ))}
            </div>
          </div>

          <div className="token-chart-legend">
            <span className="legend-item">
              <span className="legend-swatch" style={{ background: "#B83A08" }} />
              Cache Read
            </span>
            <span className="legend-item">
              <span className="legend-swatch" style={{ background: "#121110" }} />
              Input + Output
            </span>
            <span className="legend-item">
              <span className="legend-swatch" style={{ background: "#8C867B" }} />
              Cache Write
            </span>
          </div>

          <div className="chart-svg-wrap" onMouseLeave={() => setHoverIdx(null)}>
            <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} overflow="visible">
              {/* Architectural horizontal graticule lines */}
              {[0.2, 0.55, 0.9].map((ratio, idx) => (
                <line
                  key={idx}
                  x1="0"
                  y1={padT + plotH * ratio}
                  x2={W}
                  y2={padT + plotH * ratio}
                  stroke="#D8D3C8"
                  strokeDasharray="3 3"
                />
              ))}

              {/* Stacked Editorial Bar Columns */}
              {pts.map((p, i) => {
                const step = W / pts.length;
                const barW = Math.min(26, step * 0.58);
                const x = i * step + (step - barW) / 2;
                const cx = i * step + step / 2;
                const hCache = (p.cacheRead / maxTotal) * plotH;
                const hInOut = ((p.input + p.output) / maxTotal) * plotH;
                const hWrite = (p.cacheWrite / maxTotal) * plotH;

                const yCache = padT + plotH - hCache;
                const yInOut = yCache - hInOut;
                const yWrite = yInOut - hWrite;
                const isActive = (hoverIdx !== null ? hoverIdx : pts.length - 1) === i;
                const isFocused = hoverIdx === null || hoverIdx === i;

                return (
                  <g
                    key={p.label}
                    className="chart-bar-group"
                    onMouseEnter={() => setHoverIdx(i)}
                    onClick={() => setHoverIdx(i)}
                  >
                    <g style={{ opacity: isFocused ? 1 : 0.45 }}>
                      <rect
                        className="chart-bar-rect"
                        x={x}
                        y={yCache}
                        width={barW}
                        height={Math.max(2, hCache)}
                        rx="2"
                        fill="#B83A08"
                      />
                      <rect
                        className="chart-bar-rect"
                        x={x}
                        y={yInOut}
                        width={barW}
                        height={Math.max(2, hInOut)}
                        rx="2"
                        fill="#121110"
                      />
                      <rect
                        className="chart-bar-rect"
                        x={x}
                        y={yWrite}
                        width={barW}
                        height={Math.max(1.5, hWrite)}
                        rx="2"
                        fill="#8C867B"
                      />
                    </g>

                    {/* X-Axis Bucket Label */}
                    <text
                      x={cx}
                      y={H - 4}
                      textAnchor="middle"
                      fontSize="10"
                      fontFamily="JetBrains Mono"
                      fontWeight={isActive ? "700" : "600"}
                      fill={isActive ? "#B83A08" : "#6B665E"}
                    >
                      {p.label}
                    </text>

                    {/* Wide hit-area for touch & mouse scrubbing */}
                    <rect
                      x={i * step}
                      y="0"
                      width={step}
                      height={H}
                      fill="transparent"
                    />
                  </g>
                );
              })}
            </svg>
          </div>

          {/* Live Scrubbing Telemetry Readout Bar */}
          <div className="chart-readout-strip">
            <span className="t-mono" style={{ color: "var(--ink)" }}>
              BUCKET: <span style={{ color: "var(--accent)" }}>{activePoint.label}</span>
            </span>
            <span className="t-mono tnum">
              TOTAL:{" "}
              <strong style={{ color: "var(--ink)" }}>
                <AnimatedNumber value={activeTotalK} suffix="k" />
              </strong>
            </span>
            <span className="t-mono tnum" style={{ color: "var(--accent)" }}>
              CACHE R: <AnimatedNumber value={activePoint.cacheRead} suffix="k" />
            </span>
            <span className="t-mono tnum">
              IN/OUT: <AnimatedNumber value={activePoint.input + activePoint.output} suffix="k" />
            </span>
          </div>
        </div>
      );
    }

    // =========================================================================
    // GROUNDED CERAA CONSTANTS & CLOSED SETS
    // =========================================================================
    const REASONING_LEVELS = ["off", "minimal", "low", "medium", "high", "xhigh", "max"];

    // Server truth arrives in App state via /api/meta; these two lists exist
    // only so validation has something to check before the first load, and
    // the server re-checks everything on write.
    const RESERVED_SECRET_PREFIXES = ["ceraa_", "provider_api_key_", "codex_", "hermes_", "xai_", "cline_", "minimax_"];

    function isInternalSecretName(name, prefixes) {
      const list = (prefixes && prefixes.length ? prefixes : RESERVED_SECRET_PREFIXES);
      const trimmed = name.trim();
      if (!trimmed) return "Secret name is required.";
      for (const prefix of list) {
        if (trimmed.startsWith(prefix)) {
          return `Rejected by IsInternal: prefix "${prefix}" is reserved for internal Ceraa state.`;
        }
      }
      if (!/^[A-Z0-9_]+$/.test(trimmed.toUpperCase())) {
        return "Use uppercase letters, digits, and underscores only (e.g. STRIPE_LIVE_KEY).";
      }
      return null;
    }

    function App() {
      // =======================================================================
      // NAVIGATION: 4 GROUNDED TABS (All, Context, Tools, Agents)
      // =======================================================================
      const [activeTab, setActiveTab] = useState("All");
      const [tokenTimeframe, setTokenTimeframe] = useState("7d");
      const [meta, setMeta] = useState(null);
      const [apiError, setApiError] = useState(null);
      // denied replaces the whole dashboard: without Telegram credentials every
      // section would be empty, and an empty dashboard with an error bar reads
      // as broken rather than locked. window.__CERAA_DENIED is set by the
      // credential probe ahead of React; when it is set the load is skipped
      // entirely rather than fired and failed.
      const [denied, setDenied] = useState(
        typeof window !== "undefined" && window.__CERAA_DENIED === true
      );
      const [webSessionId, setWebSessionId] = useState("web");
      const [envWorkspaceRoot, setEnvWorkspaceRoot] = useState("");
      const [forbiddenSourceTreePrefix, setForbiddenSourceTreePrefix] = useState("/workspace/development/ceraa");
      const [toolInventory, setToolInventory] = useState([]);
      const [memoryTypes, setMemoryTypes] = useState([]);
      const [snapshots, setSnapshots] = useState([]);
      const [inspect, setInspect] = useState({});
      const [chartPoints, setChartPoints] = useState([]);
      const [promptText, setPromptText] = useState("");
      const [runBusy, setRunBusy] = useState(false);
      const [runFeed, setRunFeed] = useState([]);
      const [pendingCards, setPendingCards] = useState([]);
      const [cardAnswers, setCardAnswers] = useState({});

      // =======================================================================
      // 9. STATUS AND CONTROL (Bot status, /stop, version, Mini App tunnel, queue)
      // =======================================================================
      const [botStatus, setBotStatus] = useState({
        running: true,
        pollingState: "Connecting…",
        runCount: 0,
        activeRun: { active: false, sessionTitle: "", step: "", elapsed: "" },
        version: "",
        updateCheckEnabled: true,
        updateStatus: "",
        miniAppEndpoint: "",
        tunnelState: "",
        promptQueueDepth: 0
      });

      // A chat run cannot be stopped from here: the cancel route only reaches
      // this surface's own session, by design. The button enables only when
      // the active run is ours; otherwise it says where the stop lives.
      const cancellableRun =
        botStatus.activeRun.active && botStatus.activeRun.sessionTitle === webSessionId;

      const handleStopActiveRun = async () => {
        if (!cancellableRun) return;
        try {
          await Api.call("/api/sessions/" + webSessionId + "/cancel", "POST");
          setBotStatus((prev) => ({
            ...prev,
            activeRun: { active: false, sessionTitle: "", step: "Halted from the dashboard", elapsed: "" }
          }));
        } catch (err) {
          setApiError("Stop failed: " + (err.message || err));
        }
      };

      // =======================================================================
      // 1. PROVIDER AND MODEL (ActiveProvider, profiles, subscriptions, catalog)
      // =======================================================================
      const [activeProviderId, setActiveProviderId] = useState("");
      const [providerProfiles, setProviderProfiles] = useState([]);
      const [confirmDeleteProfileId, setConfirmDeleteProfileId] = useState(null);
      const [addingProfile, setAddingProfile] = useState(false);
      const [profileDraft, setProfileDraft] = useState({
        name: "",
        endpoint: "https://api.openai.com/v1",
        model: "gpt-4.1",
        apiKey: "",
        reasoning: "medium",
        contextLimit: 128000,
        outputCap: 16384,
        cacheMode: "auto-prefix"
      });

      const activeProfile = useMemo(
        () =>
          providerProfiles.find((p) => p.id === activeProviderId) ||
          providerProfiles[0] || { id: activeProviderId || "default", name: activeProviderId || "default" },
        [providerProfiles, activeProviderId]
      );

      const [subscriptions, setSubscriptions] = useState([]);

      const [modelCatalog, setModelCatalog] = useState({
        sourceUrl: "",
        lastRefresh: "—",
        refreshHours: 0
      });

      // =======================================================================
      // 2. RUN PARAMETERS (Bound to Reasoning Effort + real Ceraa parameters)
      // =======================================================================
      const [runParams, setRunParams] = useState({
        reasoningEffort: "medium",
        contextLimit: 0,
        maxOutputTokens: 0,
        maxToolResultChars: 0,
        maxConcurrentTools: 1,
        promptCacheMode: "",
        promptCacheTTL: "",
        memoryDelivery: "cached",
        agentRole: ""
      });
      const [paramsDirty, setParamsDirty] = useState(false);
      const [paramsSaved, setParamsSaved] = useState("");

      const reasoningLevels = (meta && meta.reasoning_levels) || REASONING_LEVELS;
      const reasoningIndex = reasoningLevels.indexOf(runParams.reasoningEffort);
      const stepReasoningEffort = async () => {
        const nextIdx = (reasoningIndex + 1) % reasoningLevels.length;
        const nextLevel = reasoningLevels[nextIdx];
        try {
          await Api.call("/api/runparams", "POST", { params: { reasoning: nextLevel } });
          setRunParams((prev) => ({ ...prev, reasoningEffort: nextLevel }));
        } catch (err) {
          setApiError("Reasoning change failed: " + (err.message || err));
        }
      };

      const editRunParams = (patch) => {
        setRunParams((prev) => ({ ...prev, ...patch }));
        setParamsDirty(true);
        setParamsSaved("");
      };

      const saveRunParams = async () => {
        const params = {
          reasoning: runParams.reasoningEffort,
          context_limit: Number(runParams.contextLimit) || 0,
          max_output_tokens: Number(runParams.maxOutputTokens) || 0,
          max_tool_result_chars: Number(runParams.maxToolResultChars) || 0,
          max_concurrent_tools: Number(runParams.maxConcurrentTools) || 1,
          prompt_cache_mode: runParams.promptCacheMode,
          prompt_cache_ttl: runParams.promptCacheTTL,
          memory_delivery: runParams.memoryDelivery,
          agent: runParams.agentRole
        };
        try {
          await Api.call("/api/runparams", "POST", { params });
          setParamsDirty(false);
          setParamsSaved("Saved just now");
        } catch (err) {
          setApiError("Run parameters failed: " + (err.message || err));
        }
      };

      // =======================================================================
      // 3. TOOLS AND PERMISSIONS (AlwaysAllow + read-only Tool Inventory)
      // =======================================================================
      const [alwaysAllow, setAlwaysAllow] = useState([]);

      const toggleAlwaysAllow = async (toolId) => {
        const allowed = !alwaysAllow.includes(toolId);
        try {
          await Api.call("/api/tools", "POST", { name: toolId, allowed });
          setAlwaysAllow((prev) =>
            allowed ? [...prev, toolId] : prev.filter((id) => id !== toolId)
          );
        } catch (err) {
          setApiError("Tool permission failed: " + (err.message || err));
        }
      };

      // =======================================================================
      // 4. SECRETS (AES at rest, never echoed in DOM, IsInternal enforced)
      // =======================================================================
      const [secrets, setSecrets] = useState([]);
      const [addingSecret, setAddingSecret] = useState(false);
      const [secretNameInput, setSecretNameInput] = useState("");
      const [secretError, setSecretError] = useState(null);
      const [confirmDeleteSecret, setConfirmDeleteSecret] = useState(null);
      const secretValueRef = useRef(null);

      const handleSaveSecret = async (e) => {
        e.preventDefault();
        const cleanName = secretNameInput.trim().toUpperCase();
        const validationError = isInternalSecretName(cleanName, meta && meta.reserved_prefixes);
        if (validationError) {
          if (secretValueRef.current) secretValueRef.current.value = "";
          setSecretError(validationError);
          return;
        }
        const rawVal = secretValueRef.current ? secretValueRef.current.value : "";
        const byteLength = rawVal.length;
        if (secretValueRef.current) secretValueRef.current.value = "";

        if (byteLength === 0) {
          setSecretError("Secret value cannot be empty.");
          return;
        }

        try {
          await Api.call("/api/secrets/" + encodeURIComponent(cleanName), "PUT", { value: rawVal });
        } catch (err) {
          setSecretError("Seal failed: " + (err.message || err));
          return;
        }
        await refreshSecrets();
        setSecretNameInput("");
        setSecretError(null);
        setAddingSecret(false);
      };

      const deleteSecret = async (name) => {
        try {
          await Api.call("/api/secrets/" + encodeURIComponent(name), "DELETE");
        } catch (err) {
          setSecretError("Delete failed: " + (err.message || err));
          return;
        }
        setConfirmDeleteSecret(null);
        await refreshSecrets();
      };

      // =======================================================================
      // 5. SESSIONS AND PROJECTS
      // =======================================================================

      const [projectRoots, setProjectRoots] = useState([]);
      const [projectCurrent, setProjectCurrent] = useState("");
      const [newRootInput, setNewRootInput] = useState("");
      const [rootError, setRootError] = useState(null);
      const [addingRoot, setAddingRoot] = useState(false);

      const handleAddProjectRoot = async (e) => {
        e.preventDefault();
        const path = newRootInput.trim();
        if (!path) return;
        if (!path.startsWith("/")) {
          setRootError("Project root must be an absolute path.");
          return;
        }
        // The server enforces inside-the-workspace containment, which implies
        // outside-the-source-tree. A client check here would duplicate a rule
        // it cannot see, so the refusal text comes from the server.
        try {
          await Api.call("/api/projects", "POST", { root: path });
        } catch (err) {
          setRootError("Refused: " + (err.message || err));
          return;
        }
        setNewRootInput("");
        setRootError(null);
        setAddingRoot(false);
        await refreshProjects();
      };

      const [sessions, setSessions] = useState([]);

      const [selectedSessionId, setSelectedSessionId] = useState(null);
      const [renamingSessionId, setRenamingSessionId] = useState(null);
      const [renameValue, setRenameValue] = useState("");
      const [sessionInspectorTab, setSessionInspectorTab] = useState("todos");

      const blankSession = {
        id: "", title: "—", active: false, runs: 0, toolCalls: 0, errors: 0,
        inputTok: 0, outputTok: 0, cacheReadTok: 0, cacheWriteTok: 0,
        spend: 0, pricingUsable: true, snapshots: [], todos: [], history: []
      };
      const activeSession = useMemo(() => {
        const found = sessions.find((s) => s.id === selectedSessionId) || sessions[0] || blankSession;
        const extra = inspect[found.id] || { todos: [], history: [] };
        return { ...found, todos: extra.todos, history: extra.history, snapshots };
      }, [sessions, selectedSessionId, inspect, snapshots]);

      const [fileScope, setFileScope] = useState("files/");
      const [workspaceFiles, setWorkspaceFiles] = useState({ "files/": [], "workspace/": [] });

      // =======================================================================
      // 6. MEMORY
      // =======================================================================
      const [autoCompaction, setAutoCompaction] = useState(true);
      const [lastCompactionStatus, setLastCompactionStatus] = useState("Not compacted from here yet");
      const [memories, setMemories] = useState([]);

      const triggerManualCompaction = async () => {
        setLastCompactionStatus("Compacting…");
        try {
          const res = await Api.call("/api/compaction", "POST", { session_id: selectedSessionId || "" });
          const c = (res && res.compaction) || {};
          setLastCompactionStatus(
            c.compacted
              ? "Compaction complete just now"
              : "Nothing to compact: session already fits"
          );
          await refreshMemories();
        } catch (err) {
          setLastCompactionStatus("Compaction failed: " + (err.message || err));
        }
      };

      const toggleAutoCompaction = async () => {
        const next = !autoCompaction;
        try {
          await Api.call("/api/settings", "POST", { settings: { auto_compaction: next } });
          setAutoCompaction(next);
        } catch (err) {
          setApiError("Auto-compaction failed: " + (err.message || err));
        }
      };

      const deleteMemory = async (id) => {
        try {
          await Api.call("/api/memories/" + encodeURIComponent(id), "DELETE");
          await refreshMemories();
        } catch (err) {
          setApiError("Memory delete failed: " + (err.message || err));
        }
      };

      // =======================================================================
      // 7. SKILLS AND SCHEDULES
      // =======================================================================
      const [skillProposals, setSkillProposals] = useState([]);

      const [scheduledJobs, setScheduledJobs] = useState([]);
      const [addingJob, setAddingJob] = useState(false);
      const [newJobCron, setNewJobCron] = useState("0 9 * * *");
      const [newJobTask, setNewJobTask] = useState("");

      const handleAddJob = async (e) => {
        e.preventDefault();
        if (!newJobTask.trim()) return;
        try {
          await Api.call("/api/schedules", "POST", {
            cron: newJobCron.trim() || "0 9 * * *",
            task: newJobTask.trim()
          });
        } catch (err) {
          setApiError("Schedule failed: " + (err.message || err));
          return;
        }
        setNewJobTask("");
        setAddingJob(false);
        await refreshSchedules();
      };

      const deleteSchedule = async (id) => {
        try {
          await Api.call("/api/schedules/" + encodeURIComponent(id), "DELETE");
          await refreshSchedules();
        } catch (err) {
          setApiError("Schedule delete failed: " + (err.message || err));
        }
      };

      const decideSkill = async (id, decision) => {
        try {
          await Api.call("/api/skills/" + encodeURIComponent(id), "POST", { decision });
          await refreshSkills();
        } catch (err) {
          setApiError("Skill decision failed: " + (err.message || err));
        }
      };

      // =======================================================================
      // 8. STATS
      // =======================================================================
      const [endpointCacheStats, setEndpointCacheStats] = useState([]);

      const totals = useMemo(() => {
        const spend = sessions.reduce((acc, s) => acc + s.spend, 0);
        const runs = sessions.reduce((acc, s) => acc + s.runs, 0);
        const tools = sessions.reduce((acc, s) => acc + s.toolCalls, 0);
        const errors = sessions.reduce((acc, s) => acc + s.errors, 0);
        const hasEstimate = sessions.some((s) => !s.pricingUsable);
        return { spend: spend.toFixed(2), runs, tools, errors, hasEstimate };
      }, [sessions]);

      // =======================================================================
      // LIVE DATA LAYER: every read below hits the control surface. Nothing
      // renders from a literal again past this point.
      // =======================================================================
      async function refreshMeta() {
        const body = await Api.call("/api/meta");
        const m = (body && body.meta) || {};
        setMeta(m);
        if (m.source_tree) setForbiddenSourceTreePrefix(m.source_tree);
        if (m.tool_ids) {
          const toolsBody = await Api.call("/api/tools").catch(() => null);
          const inv = ((toolsBody && toolsBody.inventory) || []).map((t) => ({
            id: t.name, category: "Tool", desc: t.description || ""
          }));
          setToolInventory(inv);
          setAlwaysAllow((toolsBody && toolsBody.always_allow) || []);
        }
        if (m.memory_types) {
          setMemoryTypes(m.memory_types.map((t) => ({
            type: t.type,
            halfLife: fmtHalfLife(t.half_life_days),
            rationale: ""
          })));
        }
      }

      function fmtHalfLife(days) {
        days = Number(days) || 0;
        if (days >= 365) {
          const yrs = days / 365;
          return days + "d (" + (Number.isInteger(yrs) ? yrs : yrs.toFixed(1)) + " yr)";
        }
        if (days >= 7) return days + "d (" + Math.round(days / 7) + " wk)";
        return days + "d";
      }

      async function refreshStatus() {
        const body = await Api.call("/api/status");
        const st = (body && body.status) || {};
        const runs = st.active_runs || [];
        const first = runs[0] || null;
        setWebSessionId(st.session || "web");
        // The hero counts live runs, not queued prompts: a big 0 beside the
        // word RUNNING is a contradiction, and it was showing exactly that.
        // Queue depth rides underneath as its own line.
        setBotStatus({
          running: st.running !== false,
          pollingState: "Long-polling (OK)",
          runCount: runs.length,
          activeRun: first
            ? { active: true, sessionTitle: first.title || first.session || "", step: "session " + (first.session || ""), elapsed: "" }
            : { active: false, sessionTitle: "", step: "No active run in flight", elapsed: "" },
          version: st.version || "",
          updateCheckEnabled: st.update_check !== false,
          updateStatus: st.update_available
            ? "Update available: " + (st.update_latest || "")
            : "Up to date",
          miniAppEndpoint: st.tunnel || "",
          tunnelState: st.tunnel ? "TLS TUNNEL UP" : "NO TUNNEL",
          promptQueueDepth: st.queued_prompts || 0
        });
        if (st.workspace) setEnvWorkspaceRoot(st.workspace);
      }

      async function refreshProviders() {
        const body = await Api.call("/api/providers");
        const list = (body && body.providers) || [];
        setProviderProfiles(list.map((p) => ({
          id: p.id, name: p.id, endpoint: p.endpoint, model: p.model,
          apiKeyRef: p.has_key ? "stored" : "not set",
          reasoning: p.reasoning || "", contextLimit: p.context_limit || 0,
          outputCap: p.output_cap || 0, cacheMode: p.cache_mode || "",
          pricingUsable: !!p.pricing_usable
        })));
        if (body && body.active) setActiveProviderId(body.active);
      }

      async function refreshSubscriptions() {
        const body = await Api.call("/api/subscriptions");
        setSubscriptions(((body && body.subscriptions) || []).map((x) => ({
          id: x.id, provider: x.label, signedIn: !!x.signed_in
        })));
      }

      async function refreshCatalog() {
        const body = await Api.call("/api/catalog");
        const c = (body && body.catalog) || {};
        setModelCatalog({
          sourceUrl: c.source_url || "",
          lastRefresh: c.models >= 0
            ? Api.relTime(c.last_refresh) + " (" + c.models + " models indexed)"
            : "—",
          refreshHours: c.refresh_hours || 0
        });
      }

      async function refreshRunParams() {
        const body = await Api.call("/api/runparams");
        const p = (body && body.params) || {};
        setRunParams({
          reasoningEffort: p.reasoning || "medium",
          contextLimit: p.context_limit || 0,
          maxOutputTokens: p.max_output_tokens || 0,
          maxToolResultChars: p.max_tool_result_chars || 0,
          maxConcurrentTools: p.max_concurrent_tools || 1,
          promptCacheMode: p.prompt_cache_mode || "",
          promptCacheTTL: p.prompt_cache_ttl || "",
          memoryDelivery: p.memory_delivery || "cached",
          agentRole: p.agent || ""
        });
        setParamsDirty(false);
        if (typeof p.auto_compaction === "boolean") setAutoCompaction(p.auto_compaction);
      }

      async function refreshSecrets() {
        const body = await Api.call("/api/secrets");
        setSecrets(((body && body.secrets) || []).map((x) => ({ name: x.name, length: x.length || "?" })));
      }

      async function refreshProjects() {
        const body = await Api.call("/api/projects");
        const p = (body && body.projects) || {};
        if (p.workspace) setEnvWorkspaceRoot(p.workspace);
        const entries = p.entries || [];
        setProjectRoots(entries.map((e) => (p.workspace || "") + "/" + e));
        setProjectCurrent(p.current || "");
      }

      function mapSessionStat(x, index) {
        return {
          id: x.id, title: x.display_title || x.title || "Untitled session", active: index === 0,
          runs: x.runs || 0, toolCalls: x.tool_calls || 0, errors: x.errors || 0,
          inputTok: x.input_tokens || 0, outputTok: x.output_tokens || 0,
          cacheReadTok: x.cache_read_tokens || 0, cacheWriteTok: x.cache_write_tokens || 0,
          spend: x.spend_usd || 0, pricingUsable: !x.has_estimate
        };
      }

      async function refreshStats() {
        const body = await Api.call("/api/stats");
        const st = (body && body.stats) || {};
        const list = (st.sessions || []).map(mapSessionStat);
        setSessions(list);
        setSelectedSessionId((prev) => {
          if (prev && list.some((x) => x.id === prev)) return prev;
          return list.length ? list[0].id : null;
        });
        setEndpointCacheStats(((st.endpoints) || []).map((e) => ({
          endpoint: e.endpoint, model: (e.models || []).join(", "),
          hitRate: Math.round((e.hit_rate || 0) * 100),
          readTok: Api.fmtK(e.read_tokens), writeTok: Api.fmtK(e.write_tokens)
        })));
        setChartPoints(st.points || []);
      }

      async function loadInspect(id) {
        if (!id) return;
        try {
          const [detailBody, todosBody] = await Promise.all([
            Api.call("/api/sessions/" + encodeURIComponent(id)),
            Api.call("/api/todos?session=" + encodeURIComponent(id))
          ]);
          const d = (detailBody && detailBody.detail) || {};
          const history = ((d.runs) || []).map((r) => ({
            id: r.id,
            time: Api.relTime(r.updated_at || r.created_at),
            tools: r.requests || 0,
            status: r.status === "completed" ? "OK" : r.status === "failed" || r.error ? "ERR" : String(r.status || "").toUpperCase(),
            summary: (r.pricing_model || "run") + (r.error ? " · " + r.error : "")
          }));
          const todos = ((todosBody && todosBody.todos) || []).map((t) => ({
            id: t.id, text: t.text, done: !!t.done
          }));
          setInspect((prev) => ({ ...prev, [id]: { todos, history } }));
        } catch (err) {
          setInspect((prev) => ({ ...prev, [id]: { todos: [], history: [] } }));
        }
      }

      async function refreshMemories() {
        const body = await Api.call("/api/memories");
        setMemories(((body && body.memories) || []).map((m) => ({
          id: m.id, type: m.type || "preference", text: m.content || "",
          provenance: (m.veracity || "unknown") +
            (m.seen > 1 ? " · confirmed " + m.seen + "x" : "") +
            (m.applies ? " · " + m.applies : "")
        })));
      }

      async function refreshSkills() {
        const body = await Api.call("/api/skills");
        setSkillProposals(((body && body.proposals) || []).map((x) => ({
          id: x.id, name: x.name, summary: x.summary || "", source: "", status: x.status
        })));
      }

      async function refreshSchedules() {
        const body = await Api.call("/api/schedules");
        setScheduledJobs(((body && body.jobs) || []).map((j) => ({
          id: j.id, cron: j.cron, task: j.task, session: j.session || ""
        })));
      }

      async function refreshSnapshots() {
        const body = await Api.call("/api/snapshots").catch(() => null);
        const list = ((body && body.snapshots) || []).map((x) => ({
          id: x.id, label: x.label, time: Api.relTime(x.time)
        }));
        setSnapshots(list);
      }

      async function loadFiles(scope) {
        try {
          const body = await Api.call("/api/files?path=" + encodeURIComponent(scope || "files/"));
          const list = ((body && body.files) || []).map((f) => ({
            name: (scope || "files/") + f.name,
            size: Api.fmtBytes(f.size),
            note: f.is_dir ? "directory" : ""
          }));
          setWorkspaceFiles((prev) => ({ ...prev, [scope || "files/"]: list }));
        } catch (err) {
          setWorkspaceFiles((prev) => ({ ...prev, [scope || "files/"]: [] }));
        }
      }

      async function refreshAll() {
        setApiError(null);
        const steps = [
          refreshMeta, refreshStatus, refreshProviders, refreshSubscriptions,
          refreshCatalog, refreshRunParams, refreshSecrets, refreshProjects,
          refreshStats, refreshMemories, refreshSkills, refreshSchedules,
          refreshSnapshots
        ];
        const results = await Promise.allSettled(steps.map((fn) => fn()));
        const failed = results.find((r) => r.status === "rejected");
        if (failed) {
          const code = failed.reason && failed.reason.status;
          if (code === 401 || code === 403) {
            setDenied(true);
            return;
          }
          setApiError("Dashboard load incomplete: " + (failed.reason.message || failed.reason));
        }
        await loadFiles("files/");
      }

      useEffect(() => {
        if (denied) return;
        refreshAll();
        const timer = setInterval(() => { refreshStatus().catch(() => {}); }, 20000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (!selectedSessionId) {
          if (sessions.length) setSelectedSessionId(sessions[0].id);
          return;
        }
        loadInspect(selectedSessionId);
      }, [selectedSessionId, sessions]);

      useEffect(() => {
        loadFiles(fileScope);
      }, [fileScope]);

      // Chart buckets: per-run instants grouped by timeframe. Sparse data
      // renders sparse bars rather than invented ones.
      const chartBuckets = useMemo(() => {
        const spans = {
          "1d": { span: 24 * 3600 * 1000, n: 8, fmt: (t) => new Date(t).getHours() + ":00" },
          "7d": { span: 7 * 24 * 3600 * 1000, n: 7, fmt: (t) => ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date(t).getDay()] },
          "30d": { span: 30 * 24 * 3600 * 1000, n: 10, fmt: (t) => (new Date(t).getMonth() + 1) + "/" + new Date(t).getDate() },
          "All": { span: 0, n: 12, fmt: (t) => (new Date(t).getMonth() + 1) + "/" + new Date(t).getDate() }
        };
        const conf = spans[tokenTimeframe] || spans["1d"];
        const now = Date.now();
        const start = conf.span ? now - conf.span : (chartPoints.length ? new Date(chartPoints[0].t).getTime() : now);
        const width = conf.span || Math.max(1, now - start);
        const buckets = [];
        for (let i = 0; i < conf.n; i++) {
          const from = start + (width * i) / conf.n;
          const to = start + (width * (i + 1)) / conf.n;
          buckets.push({ label: conf.fmt(from), cacheRead: 0, input: 0, output: 0, cacheWrite: 0, cost: 0, known: true });
          buckets[i].from = from;
        }
        for (const p of chartPoints) {
          const t = new Date(p.t).getTime();
          if (isNaN(t) || t < start) continue;
          let idx = Math.floor(((t - start) / width) * conf.n);
          if (idx >= conf.n) idx = conf.n - 1;
          if (idx < 0) idx = 0;
          const b = buckets[idx];
          b.cacheRead += (p.read || 0) / 1000;
          b.input += ((p.in || 0) - (p.read || 0)) / 1000;
          b.output += (p.out || 0) / 1000;
          b.cacheWrite += (p.write || 0) / 1000;
          b.cost += p.known ? p.cost || 0 : 0;
          if (!p.known) b.known = false;
        }
        let spend = 0, known = true, readSum = 0, inSum = 0;
        for (const b of buckets) {
          spend += b.cost;
          if (!b.known) known = false;
          readSum += b.cacheRead;
          inSum += b.input;
        }
        return {
          buckets,
          spend,
          hitRate: inSum + readSum > 0 ? Math.round((readSum / (inSum + readSum)) * 100) : 0,
          known,
          label: { "1d": "Last 24 Hours", "7d": "Last 7 Days", "30d": "Last 30 Days", "All": "All Time" }[tokenTimeframe] || "Last 24 Hours"
        };
      }, [chartPoints, tokenTimeframe]);

      // =======================================================================
      // LIVE RUN: prompt composer, event stream, permission and question cards.
      // POST /prompt starts the turn (202, busy is 409); the reply arrives on
      // GET /events, polled with the initData query form because the first
      // request is a navigation that cannot carry a header the page has not
      // loaded yet. Every later call uses the Authorization header instead.
      // =======================================================================
      async function sendPrompt(e) {
        e.preventDefault();
        const text = promptText.trim();
        if (!text || runBusy) return;
        setPromptText("");
        setRunBusy(true);
        setRunFeed([]);
        setPendingCards([]);
        try {
          await Api.call("/prompt", "POST", { text });
        } catch (err) {
          setRunFeed([{ seq: -1, kind: "error", text: String((err && err.message) || err) }]);
          setRunBusy(false);
          return;
        }
        pollEvents(0);
      }

      async function pollEvents(seq) {
        try {
          const res = await Api.call(
            "/events?initData=" + encodeURIComponent(Api.initData()) + "&after=" + seq + "&wait=15000"
          );
          let next = seq;
          const feed = [];
          const cards = [];
          for (const item of ((res && res.events) || [])) {
            next = item.seq;
            const ev = item.event || {};
            const d = ev.data || {};
            if (ev.type === "permission" || ev.type === "question") {
              cards.push({
                seq: item.seq, type: ev.type,
                requestId: d.request_id || d.requestId || "",
                text: d.text || d.message || d.prompt || "",
                detail: d.tool || d.command || ""
              });
            } else if (ev.type === "complete") {
              feed.push({ seq: item.seq, kind: "done", text: "Run complete." });
            } else if (ev.type === "error") {
              feed.push({ seq: item.seq, kind: "error", text: d.message || d.text || "Run failed." });
            } else if (ev.type === "thinking" || ev.type === "content") {
              const t = d.text || d.delta || d.message || "";
              if (t) feed.push({ seq: item.seq, kind: "stream", text: t });
            } else {
              const t = d.text || d.message || "";
              feed.push({ seq: item.seq, kind: "info", text: ev.type + (t ? ": " + t : "") });
            }
          }
          if (feed.length) setRunFeed((prev) => [...prev, ...feed]);
          if (cards.length) setPendingCards((prev) => [...prev, ...cards]);
          if (res && res.stale) {
            setRunFeed((prev) => [...prev, { seq: -1, kind: "error", text: "Stream gap: the buffer moved on. Re-open for full history." }]);
            setRunBusy(false);
            refreshStatus();
            return;
          }
          if (feed.some((f) => f.kind === "done" || f.kind === "error")) {
            setRunBusy(false);
            refreshStatus();
            refreshStats();
            return;
          }
          pollEvents(next);
        } catch (err) {
          setRunFeed((prev) => [...prev, { seq: -1, kind: "error", text: "Stream interrupted: " + ((err && err.message) || err) }]);
          setRunBusy(false);
        }
      }

      async function answerCard(card, decision, answerText) {
        try {
          if (card.type === "permission") {
            // The vocabulary the manager accepts: allowOnce, allowAlways, deny.
            await Api.call("/api/permission", "POST", { request_id: card.requestId, decision });
          } else {
            await Api.call("/api/answer", "POST", { request_id: card.requestId, answer: answerText || "" });
          }
          setPendingCards((prev) => prev.filter((c) => c.seq !== card.seq));
        } catch (err) {
          setApiError("Decision failed: " + ((err && err.message) || err));
        }
      }

      async function cancelWebRun() {
        try {
          await Api.call("/api/sessions/" + webSessionId + "/cancel", "POST");
        } catch (err) {
          setApiError("Cancel failed: " + ((err && err.message) || err));
        }
      }

      // Locked replaces the whole dashboard: without Telegram credentials every
      // section below would render empty, and an empty dashboard with an error
      // bar reads as broken rather than locked.
      if (denied) {
        return (
          <div className="shell">
            <div style={{ maxWidth: 460, margin: "12vh auto 0", textAlign: "center", padding: "0 24px" }}>
              <div className="t-mono" style={{ letterSpacing: "0.2em" }}>CERAA · PRIVATE</div>
              <div className="t-display" style={{ marginTop: 12 }}>This dashboard is locked</div>
              <div className="t-body" style={{ marginTop: 12 }}>
                It only opens from the Ceraa Telegram bot. A bare link carries no credentials, so there is nothing to show — and nothing leaked in learning that.
              </div>
              <div style={{ marginTop: 20 }}>
                <button type="button" className="btn-solid" onClick={() => window.location.reload()}>
                  Retry
                </button>
              </div>
              <div className="t-mono" style={{ marginTop: 16 }}>401 · NO TELEGRAM CREDENTIALS</div>
            </div>
          </div>
        );
      }

      return (
        <div className="shell">
          {/* =================================================================
              MASTHEAD: Brand, Status Pill, 4 Tabs, ActiveProvider, 4-Boxes Menu
              ================================================================= */}
          <header className="masthead">
            <div className="brand-row">
