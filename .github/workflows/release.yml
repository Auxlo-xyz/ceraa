name: Release

on:
  push:
    tags:
      - 'v[0-9].*'

env:
  GOFLAGS: -mod=readonly

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run tests
        run: make test

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/soraa-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/soraa-agent-linux-arm64 .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/soraa-agent-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/soraa-agent-darwin-arm64 .

      - name: Create checksums
        run: |
          cd dist
          sha256sum soraa-agent-* > ../SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/soraa-agent-*-amd64
            dist/soraa-agent-*-arm64
            dist/soraa-agent-darwin-*
            SHA256SUMS
