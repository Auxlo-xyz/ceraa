name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: make build

      - name: Check
        run: make check

      - name: Test with race detector
        run: make test

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Fuzz inbox controls
        run: go test -run FuzzInboxControlValidation -fuzz=FuzzInboxControlValidation -fuzztime=30s ./harness/coordinator/...

      - name: Fuzz sessionstore
        run: go test -run FuzzSessionStoreCorrupt -fuzz=FuzzSessionStoreCorrupt -fuzztime=30s ./harness/coordinator/...

      - name: Fuzz operation spec
        run: go test -run FuzzOperationSpec -fuzz=FuzzOperationSpec -fuzztime=30s ./harness/coordinator/...

  dist:
    # The public surface is a self-contained binary plus reviewable assets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Shell scripts parse
        run: bash -n install.sh scripts/release.sh scripts/build.sh

      - name: Build the release
        run: ./scripts/release.sh 0.0.0-ci

      - name: Checksums verify
        run: (cd dist && sha256sum -c SHA256SUMS)

      # Asserts the built binary reports the tag it was built for, which is the
      # failure a user sees first and the one that shipped as 0.1.1.
      - name: The binary reports the version it was built for
        run: ./dist/ceraa-linux-amd64 version | head -1 | grep -qx 'ceraa 0.0.0-ci'

      - name: A packaged install does not run degraded
        run: |
          rm -rf /tmp/rel && mkdir -p /tmp/rel/work
          cp dist/ceraa-linux-amd64 /tmp/rel/ceraa
          cd /tmp/rel/work
          output=$(/tmp/rel/ceraa version 2>&1)
          echo "$output"
          if echo "$output" | grep -q 'minimal fallback'; then
            echo "::error::the released binary fell back without a prompt sidecar"
            exit 1
          fi

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and test Docker image
        run: |
          docker build -t ceraa-ci .
          docker run --rm ceraa-ci version
