name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: make build

      - name: Check
        run: make check

      - name: Test with race detector
        run: make test

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Fuzz inbox controls
        run: go test -run FuzzInboxControlValidation -fuzz=FuzzInboxControlValidation -fuzztime=30s ./harness/coordinator/...

      - name: Fuzz sessionstore
        run: go test -run FuzzSessionStoreCorrupt -fuzz=FuzzSessionStoreCorrupt -fuzztime=30s ./harness/coordinator/...

      - name: Fuzz operation spec
        run: go test -run FuzzOperationSpec -fuzz=FuzzOperationSpec -fuzztime=30s ./harness/coordinator/...

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and test Docker image
        run: |
          docker build -t sooraa-ci .
          docker run --rm sooraa-ci version
