id: login-form-password-field

info:
  name: Login Page With A Password Field
  author: ceraa
  severity: info
  description: The path serves a login form. It is not a finding on its own, but it names the endpoint worth testing for the usual mistakes.
  tags: login,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
    matchers:
      - type: word
        part: body
        condition: or
        words:
          - 'type="password"'
          - "type='password'"
      - type: status
        status:
          - 200
